<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITSRION 약관 원문 검색 & AI 보상검토</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --navy: #0f1e36;
      --navy-light: #1b3154;
      --gold: #c5a059;
      --gold-soft: #f8f3e8;
      --bg: #f4f6f9;
      --border: #dde2ea;
      --text: #1e293b;
    }
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header {
      background: var(--navy); color: #fff; padding: 18px 28px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 3px solid var(--gold);
    }
    header h1 { margin: 0; font-size: 1.25rem; letter-spacing: -0.3px; }
    header span.badge {
      background: var(--gold); color: var(--navy); font-weight: 700;
      padding: 4px 10px; border-radius: 4px; font-size: 0.8rem;
    }
    .container { max-width: 1280px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; }
    @media (max-width: 960px) { .container { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(15,30,54,0.04); }
    .search-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    select, input[type="text"], textarea {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem;
    }
    .search-bar input[type="text"] { flex: 1; min-width: 220px; }
    .btn {
      cursor: pointer; border: none; border-radius: 6px; padding: 10px 16px;
      font-weight: 600; font-size: 0.92rem; transition: 0.15s;
    }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-navy:hover { background: var(--navy-light); }
    .btn-gold { background: var(--gold); color: var(--navy); width: 100%; padding: 13px; font-size: 1rem; }
    .btn-outline { background: #fff; border: 1px solid var(--navy); color: var(--navy); padding: 5px 10px; font-size: 0.82rem; }
    .rider-item {
      border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px;
      transition: border 0.15s; background: #fff;
    }
    .rider-item.selected { border: 2px solid var(--gold); background: var(--gold-soft); }
    .rider-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .insurer-tag { background: var(--navy); color: #fff; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; }
    .sim-tag { color: #0d9488; font-size: 0.8rem; font-weight: 700; }
    .summary-txt { font-size: 0.86rem; color: #475569; margin: 8px 0; line-height: 1.45; }
    .report-box { line-height: 1.65; font-size: 0.94rem; }
    .report-box table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.88rem; }
    .report-box th, .report-box td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    .report-box th { background: var(--navy); color: #fff; }
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      align-items: center; justify-content: center; z-index: 1000; padding: 16px;
    }
    .modal-content {
      background: #fff; max-width: 820px; width: 100%; max-height: 85vh;
      overflow-y: auto; border-radius: 10px; padding: 24px;
    }
    pre.raw-view { white-space: pre-wrap; background: #f8fafc; padding: 14px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.86rem; line-height: 1.55; }
  </style>
</head>
<body>

<header>
  <h1>ITSRION 약관 핀셋 검색 & AI 보상·비교 리포트</h1>
  <span class="badge">토큰 절감 하이브리드 엔진</span>
</header>

<div class="container">
  <!-- 좌측: 1단계 무료 특약·별표 검색 영역 -->
  <div class="card">
    <h3 style="margin-top:0;">1단계. 약관 특약·별표 즉시 검색 (AI 과금 없음)</h3>
    <div class="search-bar">
      <select id="sectorFilter">
        <option value="">전체 권역</option>
        <option value="손해보험">손해보험</option>
        <option value="생명보험">생명보험</option>
      </select>
      <select id="insurerFilter">
        <option value="">전체 보험사</option>
        <option value="DB손해보험">DB손해보험</option>
        <option value="KB손해보험">KB손해보험</option>
        <option value="삼성화재">삼성화재</option>
        <option value="현대해상">현대해상</option>
        <option value="메리츠화재">메리츠화재</option>
        <option value="한화손해보험">한화손해보험</option>
      </select>
      <input type="text" id="searchInput" placeholder="예: 유사암 진단비 제외 조건, 표적항암약물허가치료, 로봇수술" onkeydown="if(event.key==='Enter') searchRiders()" />
      <button class="btn btn-navy" onclick="searchRiders()">특약 검색</button>
    </div>

    <div style="font-size:0.84rem; color:#64748b; margin-bottom:10px;">
      💡 보고서로 비교·분석할 특약을 체크(최대 5개)하거나 <b>[원문·별표 열람]</b>으로 즉시 확인하세요.
    </div>
    <div id="resultsList">검색어를 입력하면 일치하는 특별약관과 연결 별표가 표시됩니다.</div>
  </div>

  <!-- 우측: 2단계 선택 특약 압축 AI 보고서 영역 -->
  <div class="card">
    <h3 style="margin-top:0;">2단계. 선택 특약 AI 심층 비교·보상 보고서</h3>
    <textarea id="reportQuestion" rows="3" style="width:100%; margin-bottom:10px;" placeholder="검토 질문 입력 (예: 선택한 두 보험사 특약의 지급사유, 감액기간, 갑상선암/경계성종양 분류코드 차이를 표로 비교해줘)"></textarea>
    <button class="btn btn-gold" id="btnGenReport" onclick="generateReport()">⚡ 선택 특약(0개) AI 검토 보고서 작성</button>

    <div id="reportMeta" style="margin-top:12px; font-size:0.82rem; color:#64748b;"></div>
    <div id="reportOutput" class="report-box" style="margin-top:14px; border-top:1px solid var(--border); padding-top:14px;">
      좌측에서 비교할 특약을 체크한 뒤 버튼을 누르면 핵심 조항과 질병분류코드만 발췌하여 보고서를 생성합니다.
    </div>
  </div>
</div>

<!-- 원문 & 별표 열람 모달 -->
<div class="modal-backdrop" id="detailModal" onclick="if(event.target===this) closeModal()">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 id="modalTitle" style="margin:0;">특약 원문 및 연결 별표</h3>
      <button class="btn btn-outline" onclick="closeModal()">닫기 ✕</button>
    </div>
    <div id="modalBody">불러오는 중...</div>
  </div>
</div>

<script>
  const API_BASE = "https://itsrion-policy-api-225817792244.asia-northeast3.run.app";
  let currentResults = [];
  let selectedMap = new Map();

  async function searchRiders() {
    const query = document.getElementById("searchInput").value.trim();
    if (!query) return alert("검색어를 입력해 주세요.");

    const listEl = document.getElementById("resultsList");
    listEl.innerHTML = "⏳ 벡터 인덱스에서 관련 특약을 찾는 중...";

    try {
      const res = await fetch(`${API_BASE}/api/policy/search`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query,
          sector: document.getElementById("sectorFilter").value || null,
          insurer: document.getElementById("insurerFilter").value || null,
          top_k: 8
        })
      });
      const data = await res.json();
      currentResults = data.items || [];
      renderResults();
      if (!document.getElementById("reportQuestion").value.trim()) {
        document.getElementById("reportQuestion").value = `${query}에 대한 지급사유, 면책/감액 조건 및 관련 별표 질병분류코드를 정리해줘.`;
      }
    } catch (err) {
      listEl.innerHTML = `❌ 서버 연결 실패: ${err.message}`;
    }
  }

  function renderResults() {
    const listEl = document.getElementById("resultsList");
    if (!currentResults.length) {
      listEl.innerHTML = "일치하는 특약이 없습니다.";
      return;
    }
    listEl.innerHTML = currentResults.map((item, idx) => {
      const key = `${item.insurer_name}|${item.content_hash}`;
      const isSel = selectedMap.has(key);
      const refs = (item.referenced_appendices || []).join(", ") || "없음";
      return `
        <div class="rider-item ${isSel ? 'selected' : ''}">
          <div class="rider-head">
            <label style="cursor:pointer; display:flex; gap:8px; align-items:center; font-weight:700;">
              <input type="checkbox" ${isSel ? 'checked' : ''} onchange="toggleSelect(${idx})" />
              <span class="insurer-tag">${item.insurer_name}</span>
              <span>${item.rider_name}</span>
            </label>
            <span class="sim-tag">일치도 ${item.similarity}%</span>
          </div>
          <div style="font-size:0.8rem; color:#64748b; margin-top:4px;">
            상품명: ${item.product_name} (${item.sale_date}) | 참조 별표: <b>${refs}</b>
          </div>
          <div class="summary-txt">${item.preview_summary}...</div>
          <button class="btn btn-outline" onclick="openDetail(${idx})">📄 원문 · 별표 코드표 무료 열람</button>
        </div>
      `;
    }).join("");
  }

  function toggleSelect(idx) {
    const item = currentResults[idx];
    const key = `${item.insurer_name}|${item.content_hash}`;
    if (selectedMap.has(key)) {
      selectedMap.delete(key);
    } else {
      if (selectedMap.size >= 5) {
        alert("토큰 절감을 위해 한 번에 최대 5개 특약까지만 비교할 수 있습니다.");
        renderResults();
        return;
      }
      selectedMap.set(key, item);
    }
    document.getElementById("btnGenReport").innerText = `⚡ 선택 특약(${selectedMap.size}개) AI 검토 보고서 작성`;
    renderResults();
  }

  async function openDetail(idx) {
    const item = currentResults[idx];
    document.getElementById("modalTitle").innerText = `[${item.insurer_name}] ${item.rider_name}`;
    document.getElementById("modalBody").innerHTML = "⏳ 원문 및 별표 JSON 로드 중...";
    document.getElementById("detailModal").style.display = "flex";

    const params = new URLSearchParams({
      bucket_rel_path: item.bucket_rel_path,
      appendix_rel_path: item.appendix_rel_path || "",
      refs: (item.referenced_appendices || []).join(",")
    });
    const res = await fetch(`${API_BASE}/api/policy/detail?${params}`);
    const data = await res.json();

    let appHtml = "";
    const appEntries = Object.entries(data.appendices || {});
    if (appEntries.length) {
      appHtml = `<h4>📎 연결된 별표 (질병/수술 분류코드)</h4>` +
        appEntries.map(([k, v]) => `<b>[${k}]</b><pre class="raw-view">${v}</pre>`).join("");
    }
    document.getElementById("modalBody").innerHTML = `
      <h4>📘 특별약관 전체 원문</h4>
      <pre class="raw-view">${data.full_text}</pre>
      ${appHtml}
    `;
  }

  function closeModal() {
    document.getElementById("detailModal").style.display = "none";
  }

  async function generateReport() {
    if (selectedMap.size === 0) return alert("좌측 검색 결과에서 분석할 특약을 1개 이상 체크해 주세요.");
    const question = document.getElementById("reportQuestion").value.trim();
    if (!question) return alert("검토 질문을 입력해 주세요.");

    const outEl = document.getElementById("reportOutput");
    const metaEl = document.getElementById("reportMeta");
    outEl.innerHTML = "⏳ 핵심 조항 압축 발췌 및 AI 비교 보고서 생성 중...";
    metaEl.innerText = "";

    const res = await fetch(`${API_BASE}/api/policy/report`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question,
        selected_riders: Array.from(selectedMap.values())
      })
    });
    const data = await res.json();
    if (!res.ok) {
      outEl.innerHTML = `❌ 오류: ${data.detail || '보고서 생성 실패'}`;
      return;
    }
    metaEl.innerText = data.cached
      ? "✅ 캐시된 보고서 즉시 로드 완료 (소모 토큰 0원)"
      : `⚡ 핵심 조항 압축 분석 완료 (투입 글자 수: 약 ${data.estimated_input_chars.toLocaleString()}자 / 예상 비용 약 2~3원)`;
    outEl.innerHTML = marked.parse(data.report);
  }
</script>
</body>
</html>
