<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB 배정 및 영업 관리 시스템</title>
    <style>
        /* [절대원칙 5] 보안 설정: 드래그, 텍스트 선택, 복사 원천 차단 */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            margin: 0; padding: 20px;
        }
        /* 화면 이탈 시 블러 처리 (스크린샷 방해) */
        body.blurred { filter: blur(15px); transition: filter 0.2s ease; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 4px solid #2563eb; }
        .hidden { display: none; }
        
        .btn-group button { margin-right: 5px; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-success { background: #2563eb; color: white; }
        .btn-absence { background: #f59e0b; color: white; }
        .btn-reject { background: #ef4444; color: white; }
        
        /* 팝업 스타일 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="header">
        <h2>나의 배정 DB 리스트</h2>
        <span id="agentNameDisplay" style="font-weight: bold; color: #1e3a8a;">설계사 로그인 중...</span>
    </div>

    <!-- DB 리스트가 렌더링 될 영역 -->
    <div id="dbContainer">
        <p style="color: #64748b;">배정된 DB를 불러오는 중입니다...</p>
    </div>

    <!-- 1차/2차 면담 등록 팝업 (네이버 캘린더 연동) -->
    <div id="meetingModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top: 0;">면담 일정 등록</h3>
            <input type="hidden" id="targetCustomerName">
            <input type="hidden" id="targetMeetingType">
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 14px; margin-bottom: 5px;">미팅 날짜 및 시간:</label>
                <input type="datetime-local" id="meetingDateTime" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="submitMeeting()" style="flex: 1; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;">달력 연동 및 저장</button>
                <button onclick="closeModal()" style="flex: 1; padding: 10px; background: #e2e8f0; color: #333; border: none; border-radius: 4px; cursor: pointer;">취소</button>
            </div>
        </div>
    </div>

    <script>
        // --- [보안 및 제어 로직] ---
        document.addEventListener('contextmenu', e => e.preventDefault()); // 우클릭 금지
        document.addEventListener('copy', e => { e.preventDefault(); alert('개인정보 보호를 위해 복사는 금지되어 있습니다.'); }); // 복사 금지
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's' || e.key === 'c')) {
                e.preventDefault(); // 인쇄, 저장, 복사 단축키 차단
            }
        });
        // 화면 이탈 시 블러 (스크린샷 방지)
        window.addEventListener('blur', () => document.body.classList.add('blurred'));
        window.addEventListener('focus', () => document.body.classList.remove('blurred'));

        // --- [통신 로직] ---
        const GAS_WEBAPP_URL = "여기에_구글_앱스크립트_URL_입력"; 
        const currentAgent = "테스트설계사"; // 추후 로그인 세션과 연동
        document.getElementById('agentNameDisplay').innerText = `${currentAgent} 님`;

        async function loadAssignedDBs() {
            try {
                // 백엔드(GAS)로 내 DB 요청
                const response = await fetch(`${GAS_WEBAPP_URL}?agent=${encodeURIComponent(currentAgent)}`);
                const data = await response.json();
                renderDBList(data);
            } catch (error) {
                document.getElementById('dbContainer').innerHTML = "<p>데이터를 불러오는데 실패했습니다.</p>";
            }
        }

        function renderDBList(dbs) {
            const container = document.getElementById('dbContainer');
            if(dbs.length === 0) { container.innerHTML = "<p>현재 배정된 대기 DB가 없습니다.</p>"; return; }
            
            let html = '';
            dbs.forEach(db => {
                html += `
                <div class="card">
                    <div style="display: flex; justify-content: space-between;">
                        <h4 style="margin: 0;">${db.customerName} 고객님</h4>
                        <span style="font-size: 12px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px;">TM시간: ${db.tmTime}</span>
                    </div>
                    <p style="font-size: 14px; color: #475569; margin: 10px 0;">
                        📞 010-****-**** (웹 발신 클릭 시 연결)<br>
                        📍 지역: ${db.region}<br>
                        📝 메모: ${db.memo}
                    </p>
                    <div class="btn-group">
                        <span style="font-size: 12px; font-weight: bold; margin-right: 10px;">${db.taStep} (제한시간: ${db.timeLimit})</span>
                        <button class="btn-success" onclick="openModal('${db.customerName}', '1차면담')">성공(미팅등록)</button>
                        <button class="btn-absence" onclick="updateStatus('${db.customerName}', '부재')">부재</button>
                        <button class="btn-reject" onclick="updateStatus('${db.customerName}', '거절')">거절</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function openModal(customerName, meetingType) {
            document.getElementById('targetCustomerName').value = customerName;
            document.getElementById('targetMeetingType').value = meetingType;
            document.getElementById('modalTitle').innerText = `${meetingType} 일정 등록`;
            document.getElementById('meetingModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('meetingModal').classList.add('hidden'); }

        async function submitMeeting() {
            const customerName = document.getElementById('targetCustomerName').value;
            const meetingType = document.getElementById('targetMeetingType').value;
            const dateTime = document.getElementById('meetingDateTime').value;

            if(!dateTime) { alert("일시를 지정해주세요."); return; }

            // 네이버 캘린더 연동을 위해 GAS로 데이터 POST 전송
            const payload = {
                action: "registerCalendar",
                agentName: currentAgent,
                customerName: customerName,
                meetingType: meetingType,
                dateTime: dateTime
            };

            try {
                await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                alert("네이버 캘린더에 성공적으로 일정이 등록되었습니다.");
                closeModal();
                loadAssignedDBs(); // 목록 새로고침
            } catch (e) {
                alert("등록 중 오류가 발생했습니다.");
            }
        }

        async function updateStatus(customerName, status) {
            if(!confirm(`${status} 처리 하시겠습니까?`)) return;
            // 부재/거절 시 상태 업데이트 전송
            const payload = { action: "updateStatus", customerName: customerName, status: status };
            await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
            alert("처리되었습니다.");
            loadAssignedDBs();
        }

        // 초기 데이터 로드
        loadAssignedDBs();
    </script>
</body>
</html>
