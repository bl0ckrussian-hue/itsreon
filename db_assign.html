<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itsrion DB 배정 시스템 (보안 뷰어)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f8fafc;
        }
        body.blurred { filter: blur(15px); transition: filter 0.2s ease; }
        .capture-protect-mode {
            filter: blur(15px) !important;
            opacity: 0.1 !important;
            pointer-events: none !important;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar relative">

    <header class="bg-slate-900 text-white p-4 xl:p-5 shadow-md flex justify-between items-center sticky top-0 z-40 w-full md:min-w-[1400px]">
        <div>
            <h1 class="text-lg xl:text-xl font-black tracking-tight">나의 배정 DB 리스트</h1>
            <p class="text-[10px] xl:text-xs text-slate-400 mt-1">고객 정보 보호를 위해 화면 캡처 및 복사가 금지됩니다.</p>
        </div>
        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
            <div class="flex items-center gap-1.5 sm:gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="agentNameDisplay" class="font-bold text-xs sm:text-sm xl:text-lg text-emerald-400">로딩 중...</span>
            </div>
            <button type="button" onclick="window.close(); if(!window.closed) history.back();" class="text-xs sm:text-sm font-bold text-slate-300 hover:text-white transition bg-slate-800 hover:bg-slate-700 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg border border-slate-700 whitespace-nowrap shadow-sm">
                창 닫기 ✕
            </button>
        </div>
    </header>

    <main class="w-full p-3 xl:p-6 flex-grow overflow-x-auto pb-32">
        <div id="dbContainer" class="w-full">
            <div class="text-center py-20 text-slate-500 font-bold">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </main>

    <!-- 계약 정보 입력 팝업창 -->
    <div id="contractModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-800 p-4 flex justify-between items-center text-white">
                <h2 class="font-bold text-lg">📝 계약 세부 정보 입력</h2>
                <div class="flex gap-2">
                    <button onclick="addContractRow()" class="bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 rounded font-bold text-xs transition">➕ 추가</button>
                    <button onclick="removeContractRow()" class="bg-rose-500 hover:bg-rose-600 px-3 py-1.5 rounded font-bold text-xs transition">➖ 삭제</button>
                </div>
            </div>
            
            <div class="p-5 overflow-y-auto bg-slate-50 custom-scrollbar flex-grow" id="contractRowsContainer"></div>
            
            <div class="bg-white p-4 border-t border-slate-200 flex justify-end gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                <button onclick="closeContractModal()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold text-sm text-slate-700 transition">취소</button>
                <button onclick="confirmContractModal()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-sm shadow-md transition">✅ 확인 및 계산</button>
            </div>
        </div>
    </div>

    <!-- 스케줄 입력 팝업창 -->
    <div id="scheduleInputModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col">
            <div class="bg-blue-600 p-4 flex justify-between items-center text-white">
                <h2 class="font-bold text-lg flex items-center gap-2"><span>📅</span> <span>일정 스케줄 등록</span></h2>
                <button onclick="closeScheduleModal()" class="text-white hover:text-slate-200 text-xl font-bold">✕</button>
            </div>
            
            <div class="p-5 bg-slate-50 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">1. 상담 유형 선택</label>
                    <select id="schType" class="w-full p-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:outline-none text-sm font-bold text-slate-700 bg-white shadow-sm">
                        <option value="">- 선택 -</option>
                        <option value="초회상담">초회상담</option>
                        <option value="2차상담">2차상담</option>
                        <option value="3차상담">3차상담</option>
                        <option value="4차상담">4차상담</option>
                        <option value="계약">계약</option>
                        <option value="계약관리">계약관리</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">2. 날짜 및 시간</label>
                    <input type="datetime-local" id="schDateTime" class="w-full p-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:outline-none text-sm font-bold text-slate-700 bg-white shadow-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">3. 장소 및 메모</label>
                    <input type="text" id="schLocation" placeholder="예: 강남역 스벅, 방문 상담 등" class="w-full p-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:outline-none text-sm bg-white shadow-sm">
                </div>
            </div>
            
            <div class="bg-white p-4 border-t border-slate-200 flex justify-end gap-3 z-10">
                <button onclick="clearScheduleInput()" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg font-bold text-sm transition">입력 지우기</button>
                <div class="flex-grow"></div>
                <button onclick="closeScheduleModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold text-sm text-slate-700 transition">취소</button>
                <button onclick="confirmScheduleModal()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-sm shadow-md transition">적용</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 xl:bottom-10 xl:right-10 z-50">
        <button id="globalSaveBtn" onclick="saveAllChanges()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-5 xl:py-4 xl:px-8 rounded-full shadow-[0_10px_25px_-5px_rgba(37,99,235,0.6)] transition-all hover:scale-105 flex items-center gap-2 xl:gap-3 border-2 border-white">
            <span id="globalSaveText" class="text-sm xl:text-[15px] tracking-wide">💾 전체 저장</span>
        </button>
    </div>

    <script src="db_assign.js"></script>
</body>
</html>
