<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itsrion DB 배정 시스템 (보안 뷰어)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            font-family: 'Malgun Gothic', sans-serif; background-color: #f8fafc;
        }
        body.blurred { filter: blur(15px); transition: filter 0.2s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar relative">

    <!-- ⭐️ 상단 헤더 (모바일에서는 가로 폭 제한 해제) -->
    <header class="bg-slate-900 text-white p-4 xl:p-5 shadow-md flex justify-between items-center sticky top-0 z-40 w-full xl:min-w-[1400px]">
        <div>
            <h1 class="text-lg xl:text-xl font-black tracking-tight">나의 배정 DB 리스트</h1>
            <p class="text-[10px] xl:text-xs text-slate-400 mt-1">고객 정보 보호를 위해 화면 캡처 및 복사가 금지됩니다.</p>
        </div>
        <div class="flex items-center gap-2 xl:gap-3">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="agentNameDisplay" class="font-bold text-sm xl:text-lg text-emerald-400">로딩 중...</span>
        </div>
    </header>

    <main class="w-full p-3 xl:p-6 flex-grow overflow-x-auto pb-32">
        <div id="dbContainer" class="w-full">
            <div class="text-center py-20 text-slate-500 font-bold">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </main>

    <!-- ⭐️ 우측 하단 고정(Floating) 전체 저장 버튼 (모바일 최적화 크기 조절) -->
    <div class="fixed bottom-6 right-6 xl:bottom-10 xl:right-10 z-50">
        <button id="globalSaveBtn" onclick="saveAllChanges()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-5 xl:py-4 xl:px-8 rounded-full shadow-[0_10px_25px_-5px_rgba(37,99,235,0.6)] transition-all hover:scale-105 flex items-center gap-2 xl:gap-3 border-2 border-white">
            <span id="globalSaveText" class="text-sm xl:text-[15px] tracking-wide">💾 전체 저장</span>
        </button>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault()); 
        document.addEventListener('copy', e => { e.preventDefault(); alert('개인정보 보호를 위해 복사는 금지되어 있습니다.'); }); 
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's' || e.key === 'c')) e.preventDefault(); 
        });
        window.addEventListener('blur', () => {
            if (document.activeElement && document.activeElement.tagName === 'IFRAME') return;
            document.body.classList.add('blurred');
        });
        window.addEventListener('focus', () => document.body.classList.remove('blurred'));

        // ⭐️ 기존 웹앱 URL로 교체해 주세요!
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwLD_sa3kWHtxoRjXX0VqOaTTZ6YFNtp9m9Ni236AUl-3rb8xSn491-JjJ-eiE0k9PA/exec"; 
        
        const currentAgent = localStorage.getItem('rion_logged_user');
        let modifiedRows = new Set(); 

        if (!currentAgent) {
            alert('보안 접근입니다. 메인 홈페이지에서 로그인을 먼저 진행해주세요.');
            window.close();
        } else {
            document.getElementById('agentNameDisplay').innerText = `${currentAgent} 팀장님`;
            loadAssignedDBs();
        }

        async function loadAssignedDBs() {
            modifiedRows.clear(); 
            try {
                const response = await fetch(`${GAS_WEBAPP_URL}?agent=${encodeURIComponent(currentAgent)}`);
                const data = await response.json();
                renderDBList(data);
            } catch (error) {
                document.getElementById('dbContainer').innerHTML = `
                    <div class="text-center py-20 text-rose-500 font-bold">
                        데이터 서버와 연결할 수 없습니다.<br><span class="text-xs mt-2 block">오류 내용: ${error.message}</span>
                    </div>`;
            }
        }

        function renderDBList(dbs) {
            const container = document.getElementById('dbContainer');
            if(!dbs || dbs.length === 0) { 
                container.innerHTML = "<div class='text-center py-20 text-slate-500 font-bold'>현재 배정된 대기 DB가 없습니다.</div>"; 
                return; 
            }
            
            let desktopHtml = '';
            let mobileHtml = '';

            dbs.forEach((db, index) => {
                const valTa1 = db.ta1 || '';
                const valTa2 = db.ta2 || '';
                const valTa3 = db.ta3 || '';
                const valTa4 = db.ta4 || '';
                const valStatus = db.status || '';
                const valSchedule = db.schedule || '';
                const valNote = db.note || '';

                // ==========================================
                // 💻 1. 데스크톱 뷰 (가로형 표 양식)
                // ==========================================
                desktopHtml += `
                    <tr class="bg-slate-50 font-medium border-b border-slate-200 hover:bg-slate-100 transition">
                        <td class="p-2 border-r border-slate-200 font-bold text-slate-500">${index + 1}</td>
                        <td class="p-2 border-r border-slate-200">${db.assignDate || '-'}</td>
                        <td class="p-2 border-r border-slate-200 font-bold text-blue-600">${db.phone || '-'}</td>
                        <td class="p-2 border-r border-slate-200"><span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-1.5 py-0.5 rounded">${db.region || '-'}</span></td>
                        <td class="p-2 border-r border-slate-200 font-bold text-sm text-slate-900">${db.customerName || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.sido || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.gugun || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.dong || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.birth || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.gender || '-'}</td>
                        <td class="p-2 border-r border-slate-200 text-left whitespace-normal break-keep text-[11px] leading-snug">${db.memo || '-'}</td>
                        <td class="p-2 border-r border-slate-200 font-bold">${currentAgent}</td>
                        <td class="p-2 border-r border-slate-200 font-bold text-emerald-600">${valStatus || '-'}</td>
                        <td class="p-2 border-r border-slate-200 text-[10px]">${db.assignDateTime || '-'}</td>
                        <td class="p-2"><span class="text-rose-600 font-black text-[11px]">${db.timeLimit || '-'}</span></td>
                    </tr>
                    <tr class="border-b-4 border-slate-400">
                        <td colspan="15" class="p-0 bg-white">
                            <input type="hidden" id="custName_${index}" value="${db.customerName}">
                            <div id="edit_area_${index}" class="flex items-center w-full bg-amber-50 p-2 gap-2 transition-all">
                                <div class="w-[22%] shrink-0 flex items-center gap-1.5 pl-1">
                                    <span class="text-[11px] font-bold text-slate-700 whitespace-nowrap shrink-0 tracking-tight">🎧 녹취듣기</span>
                                    <div class="flex-grow w-full">
                                        ${db.audioUrl ? 
                                          `<iframe src="${db.audioUrl.replace('uc?export=download&id=', 'file/d/')}/preview" class="w-full h-8 rounded border border-slate-300 bg-white shadow-sm"></iframe>` 
                                          : `<div class="w-full h-8 flex items-center justify-center bg-slate-100 rounded border border-slate-200 text-[10px] text-slate-400 shadow-inner">녹취 파일 없음</div>`
                                        }
                                    </div>
                                </div>
                                <div class="w-[8%] shrink-0">${generateTaSelect(`ta1_${index}`, '1차 TA(1일)', valTa1, index)}</div>
                                <div class="w-[8%] shrink-0">${generateTaSelect(`ta2_${index}`, '2차 TA(2일)', valTa2, index)}</div>
                                <div class="w-[8%] shrink-0">${generateTaSelect(`ta3_${index}`, '3차 TA(3일)', valTa3, index)}</div>
                                <div class="w-[8%] shrink-0">${generateTaSelect(`ta4_${index}`, '4차 이상 TA', valTa4, index)}</div>
                                <div class="w-[12%] shrink-0 flex gap-1">
                                    <input type="text" id="schedule_${index}" value="${valSchedule}" onchange="markModified(${index})" placeholder="일정(스케줄입력)" class="w-full px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs">
                                    <a href="https://calendar.naver.com/" target="_blank" class="bg-emerald-500 text-white px-2 py-1.5 rounded font-bold hover:bg-emerald-600 transition flex items-center justify-center text-[10px] shrink-0" title="네이버 캘린더">N</a>
                                </div>
                                <div class="w-[10%] shrink-0">
                                    <select id="status_${index}" onchange="markModified(${index})" class="w-full p-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs font-bold text-slate-700 bg-white">
                                        <option value="" ${valStatus===''?'selected':''}>- 진행현황 -</option>
                                        <option value="상담 중" ${valStatus==='상담 중'?'selected':''}>상담 중</option>
                                        <option value="상담완료" ${valStatus==='상담완료'?'selected':''}>상담완료</option>
                                        <option value="계약" ${valStatus==='계약'?'selected':''}>계약</option>
                                        <option value="장기배양(심사)" ${valStatus==='장기배양(심사)'?'selected':''}>장기배양(심사)</option>
                                        <option value="거절" ${valStatus==='거절'?'selected':''}>거절</option>
                                    </select>
                                </div>
                                <div class="w-[24%] shrink-0">
                                    <input type="text" id="note_${index}" value="${valNote}" onchange="markModified(${index})" placeholder="비고(특이사항) 입력" class="w-full px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs">
                                </div>
                            </div>
                        </td>
                    </tr>
                `;

                // ==========================================
                // 📱 2. 모바일 뷰 (세로형 카드 양식)
                // ==========================================
                mobileHtml += `
                    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden relative">
                        <input type="hidden" id="m_custName_${index}" value="${db.customerName}">
                        <div id="m_edit_area_${index}" class="p-4 transition-all bg-white">
                            
                            <!-- 상단 헤더: 번호, 이름, 유효기간 -->
                            <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-3">
                                <div class="flex items-center gap-2">
                                    <span class="bg-slate-800 text-white text-[10px] px-2 py-0.5 rounded font-bold">No.${index + 1}</span>
                                    <span class="font-black text-base text-slate-900">${db.customerName || '-'}</span>
                                </div>
                                <span class="text-rose-600 font-black text-xs bg-rose-50 px-2 py-1 rounded border border-rose-100">${db.timeLimit || '-'}</span>
                            </div>

                            <!-- 고객 상세 정보 -->
                            <div class="grid grid-cols-2 gap-y-2 gap-x-1 text-xs mb-3 text-slate-600">
                                <div><span class="text-slate-400 mr-1">연락처</span> <span class="font-bold text-blue-600">${db.phone || '-'}</span></div>
                                <div><span class="text-slate-400 mr-1">성별/생년</span> ${db.gender || '-'} | ${db.birth || '-'}</div>
                                <div class="col-span-2"><span class="text-slate-400 mr-1">지 역</span> ${db.region || '-'} ${db.sido || '-'} ${db.gugun || '-'} ${db.dong || '-'}</div>
                                <div><span class="text-slate-400 mr-1">배 분</span> ${db.assignDate || '-'}</div>
                                <div><span class="text-slate-400 mr-1">상 태</span> <span class="font-bold text-emerald-600">${valStatus || '-'}</span></div>
                            </div>
                            
                            <!-- 메모 -->
                            <div class="text-xs text-slate-600 mb-4 bg-slate-50 p-2 rounded border border-slate-100 leading-snug">
                                <span class="font-bold text-slate-500 block mb-1">📝 메모</span>
                                ${db.memo || '-'}
                            </div>

                            <!-- ⭐️ 입력 폼 (모바일 최적화 세로 배치) -->
                            <div class="space-y-2 bg-amber-50/50 p-3 rounded-lg border border-amber-100">
                                <!-- 녹취 -->
                                <div class="w-full flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold text-slate-700 whitespace-nowrap shrink-0">🎧 녹취</span>
                                    <div class="flex-grow w-full">
                                        ${db.audioUrl ? 
                                          `<iframe src="${db.audioUrl.replace('uc?export=download&id=', 'file/d/')}/preview" class="w-full h-8 rounded border border-slate-300 bg-white shadow-sm"></iframe>` 
                                          : `<div class="w-full h-8 flex items-center justify-center bg-slate-100 rounded border border-slate-200 text-[10px] text-slate-400 shadow-inner">녹취 파일 없음</div>`
                                        }
                                    </div>
                                </div>

                                <!-- TA 선택 2x2 그리드 -->
                                <div class="grid grid-cols-2 gap-2">
                                    ${generateTaSelect(`m_ta1_${index}`, '1차 TA(1일)', valTa1, index)}
                                    ${generateTaSelect(`m_ta2_${index}`, '2차 TA(2일)', valTa2, index)}
                                    ${generateTaSelect(`m_ta3_${index}`, '3차 TA(3일)', valTa3, index)}
                                    ${generateTaSelect(`m_ta4_${index}`, '4차 이상 TA', valTa4, index)}
                                </div>

                                <!-- 스케줄 & 현황 -->
                                <div class="flex gap-2 pt-1">
                                    <div class="w-[55%] flex gap-1">
                                        <input type="text" id="m_schedule_${index}" value="${valSchedule}" onchange="markModified(${index})" placeholder="일정(스케줄)입력" class="w-full px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs">
                                        <a href="https://calendar.naver.com/" target="_blank" class="bg-emerald-500 text-white px-2 py-1.5 rounded font-bold flex items-center justify-center text-[10px] shrink-0" title="네이버 캘린더">N</a>
                                    </div>
                                    <div class="w-[45%]">
                                        <select id="m_status_${index}" onchange="markModified(${index})" class="w-full p-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs font-bold text-slate-700 bg-white">
                                            <option value="" ${valStatus===''?'selected':''}>- 현황 -</option>
                                            <option value="상담 중" ${valStatus==='상담 중'?'selected':''}>상담 중</option>
                                            <option value="상담완료" ${valStatus==='상담완료'?'selected':''}>상담완료</option>
                                            <option value="계약" ${valStatus==='계약'?'selected':''}>계약</option>
                                            <option value="장기배양(심사)" ${valStatus==='장기배양(심사)'?'selected':''}>장기배양(심사)</option>
                                            <option value="거절" ${valStatus==='거절'?'selected':''}>거절</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- 비고 -->
                                <div class="pt-1">
                                    <input type="text" id="m_note_${index}" value="${valNote}" onchange="markModified(${index})" placeholder="비고(특이사항) 입력" class="w-full px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs">
                                </div>
                            </div>

                        </div>
                    </div>
                `;
            });

            // 데스크톱 표 + 모바일 카드 합치기 (화면 크기에 따라 하나만 보임)
            let html = `
                <!-- 🖥️ 데스크톱 뷰 (xl 이상 화면에서 노출) -->
                <div class="hidden xl:block bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden min-w-[1400px]">
                    <table class="w-full text-xs text-center border-collapse whitespace-nowrap">
                        <thead class="bg-slate-800 text-white">
                            <tr>
                                <th class="p-2 border-r border-slate-700 font-medium w-10">No.</th>
                                <th class="p-2 border-r border-slate-700 font-medium">배분날짜</th>
                                <th class="p-2 border-r border-slate-700 font-medium">전화번호</th>
                                <th class="p-2 border-r border-slate-700 font-medium">지역</th>
                                <th class="p-2 border-r border-slate-700 font-medium text-amber-300">고객명</th>
                                <th class="p-2 border-r border-slate-700 font-medium">시도</th>
                                <th class="p-2 border-r border-slate-700 font-medium">구군</th>
                                <th class="p-2 border-r border-slate-700 font-medium">읍면동</th>
                                <th class="p-2 border-r border-slate-700 font-medium">생년월일</th>
                                <th class="p-2 border-r border-slate-700 font-medium">성별</th>
                                <th class="p-2 border-r border-slate-700 font-medium whitespace-normal w-40">메모</th>
                                <th class="p-2 border-r border-slate-700 font-medium">담당설계사</th>
                                <th class="p-2 border-r border-slate-700 font-medium text-emerald-300">진행상태</th>
                                <th class="p-2 border-r border-slate-700 font-medium">배정일시</th>
                                <th class="p-2 font-medium text-rose-300">유효기간</th>
                            </tr>
                        </thead>
                        <tbody class="text-slate-700">
                            ${desktopHtml}
                        </tbody>
                    </table>
                </div>

                <!-- 📱 모바일 뷰 (xl 미만 화면에서 노출) -->
                <div class="block xl:hidden flex flex-col gap-4">
                    ${mobileHtml}
                </div>
            `;
            container.innerHTML = html;
        }

        // 선택 박스 렌더링
        function generateTaSelect(id, label, selectedValue, index) {
            const val = selectedValue || '';
            const colorClass = val === '' ? 'text-slate-500' : 'text-slate-800';
            return `
            <select id="${id}" onchange="markModified(${index})" class="w-full p-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs font-bold ${colorClass} bg-white">
                <option value="" ${val===''?'selected':''}>- ${label} -</option>
                <option value="부재" ${val==='부재'?'selected':''}>부재</option>
                <option value="다시" ${val==='다시'?'selected':''}>다시</option>
                <option value="거절" ${val==='거절'?'selected':''}>거절</option>
                <option value="예정" ${val==='예정'?'selected':''}>예정</option>
                <option value="본인설계사" ${val==='본인설계사'?'selected':''}>본인설계사</option>
            </select>
            `;
        }

        // 수정 시 색상 변경 하이라이트 적용 (PC, 모바일 동시 적용)
        function markModified(index) {
            modifiedRows.add(index);
            
            const rowDivD = document.getElementById(`edit_area_${index}`);
            if(rowDivD) {
                rowDivD.classList.remove('bg-amber-50');
                rowDivD.classList.add('bg-blue-50', 'ring-2', 'ring-inset', 'ring-blue-400');
            }

            const rowDivM = document.getElementById(`m_edit_area_${index}`);
            if(rowDivM) {
                rowDivM.classList.remove('bg-white');
                rowDivM.classList.add('bg-blue-50', 'ring-2', 'ring-inset', 'ring-blue-400');
            }
        }

        // ⭐️ 전체 저장 로직 (접속 기기에 맞춰 데이터 전송)
        async function saveAllChanges() {
            if (modifiedRows.size === 0) {
                alert("수정된 항목이 없습니다.");
                return;
            }

            const btn = document.getElementById('globalSaveBtn');
            const textSpan = document.getElementById('globalSaveText');
            
            btn.disabled = true;
            btn.classList.replace('bg-blue-600', 'bg-slate-500');

            // 핸드폰 화면이면 'm_' 아이디를 읽고, PC 화면이면 일반 아이디를 읽도록 자동 판별
            const isMobileView = window.innerWidth < 1280;
            const pfx = isMobileView ? 'm_' : '';

            let successCount = 0;
            let failCount = 0;
            const total = modifiedRows.size;
            const indexes = Array.from(modifiedRows);

            for (let i = 0; i < indexes.length; i++) {
                const idx = indexes[i];
                
                textSpan.innerText = `⏳ 저장 중... (${i+1}/${total})`;

                const payload = {
                    action: "updateHyunhwang",
                    agentName: currentAgent,
                    customerName: document.getElementById(`${pfx}custName_${idx}`).value,
                    ta1: document.getElementById(`${pfx}ta1_${idx}`).value,
                    ta2: document.getElementById(`${pfx}ta2_${idx}`).value,
                    ta3: document.getElementById(`${pfx}ta3_${idx}`).value,
                    ta4: document.getElementById(`${pfx}ta4_${idx}`).value,
                    schedule: document.getElementById(`${pfx}schedule_${idx}`).value,
                    status: document.getElementById(`${pfx}status_${idx}`).value,
                    note: document.getElementById(`${pfx}note_${idx}`).value
                };

                try {
                    const response = await fetch(GAS_WEBAPP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if(result.success) successCount++;
                } catch (error) {
                    failCount++;
                }
            }

            alert(`총 ${total}건 중 ${successCount}건이 성공적으로 저장되었습니다.` + (failCount > 0 ? `\n(실패: ${failCount}건)` : ""));
            
            btn.disabled = false;
            btn.classList.replace('bg-slate-500', 'bg-blue-600');
            textSpan.innerText = "💾 전체 저장";
            
            loadAssignedDBs(); 
        }
    </script>
</body>
</html>
