<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itsrion DB 배정 시스템 (보안 뷰어)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* [보안 절대 원칙] 드래그, 복사, 텍스트 선택 원천 차단 */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f8fafc;
        }
        /* 화면 이탈 시 블러 처리 (스크린샷 방해) */
        body.blurred { filter: blur(15px); transition: filter 0.2s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

    <!-- 상단 헤더 -->
    <header class="bg-slate-900 text-white p-5 shadow-md flex justify-between items-center sticky top-0 z-40">
        <div>
            <h1 class="text-xl font-black tracking-tight">나의 배정 DB 리스트</h1>
            <p class="text-xs text-slate-400 mt-1">고객 정보 보호를 위해 화면 캡처 및 복사가 금지됩니다.</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="agentNameDisplay" class="font-bold text-lg text-emerald-400">로딩 중...</span>
        </div>
    </header>

    <!-- DB 리스트 표 렌더링 영역 -->
    <main class="max-w-7xl mx-auto w-full p-6 flex-grow overflow-x-auto">
        <div id="dbContainer" class="w-full">
            <div class="text-center py-20 text-slate-500 font-bold">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </main>

    <script>
        // --- [보안 제어 로직] ---
        document.addEventListener('contextmenu', e => e.preventDefault()); 
        document.addEventListener('copy', e => { e.preventDefault(); alert('개인정보 보호를 위해 복사는 금지되어 있습니다.'); }); 
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's' || e.key === 'c')) e.preventDefault(); 
        });
        
        // 오디오 플레이어(iframe)를 클릭해서 포커스를 잃은 경우는 블러 처리 예외
        window.addEventListener('blur', () => {
            if (document.activeElement && document.activeElement.tagName === 'IFRAME') return;
            document.body.classList.add('blurred');
        });
        window.addEventListener('focus', () => document.body.classList.remove('blurred'));

        // --- [데이터 연동 핵심 로직] ---
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxqvmasH-avzis8xuxC2gGTbB2RW4ji1bjIqugDUvUH-ckY4_NVBxLFsM4XkJ_9-Q/exec"; 
        
        // 메인 index.html에서 로그인할 때 저장한 이름 가져오기
        const currentAgent = localStorage.getItem('rion_logged_user');

        if (!currentAgent) {
            alert('보안 접근입니다. 메인 홈페이지에서 로그인을 먼저 진행해주세요.');
            window.close();
        } else {
            document.getElementById('agentNameDisplay').innerText = `${currentAgent} 팀장님`;
            loadAssignedDBs();
        }

        async function loadAssignedDBs() {
            try {
                const response = await fetch(`${GAS_WEBAPP_URL}?agent=${encodeURIComponent(currentAgent)}`);
                const data = await response.json();
                renderDBList(data);
            } catch (error) {
                document.getElementById('dbContainer').innerHTML = `
                    <div class="text-center py-20 text-rose-500 font-bold">
                        데이터 서버와 연결할 수 없습니다. URL을 확인해주세요.<br><span class="text-xs text-slate-400 mt-2 block">오류 내용: ${error.message}</span>
                    </div>`;
            }
        }

        // ⭐️ 엑셀 표(Table) 형식 렌더링 함수
        function renderDBList(dbs) {
            const container = document.getElementById('dbContainer');
            if(!dbs || dbs.length === 0) { 
                container.innerHTML = "<div class='text-center py-20 text-slate-500 font-bold'>현재 배정된 대기 DB가 없습니다.</div>"; 
                return; 
            }
            
            let html = `
            <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden min-w-[1000px]">
                <table class="w-full text-sm text-center border-collapse whitespace-nowrap">
                    <thead class="bg-slate-800 text-white">
                        <tr>
                            <th class="p-3 border-b border-slate-700 font-medium">제한시간</th>
                            <th class="p-3 border-b border-slate-700 font-medium">지역</th>
                            <th class="p-3 border-b border-slate-700 font-medium">고객명</th>
                            <th class="p-3 border-b border-slate-700 font-medium">전화번호</th>
                            <th class="p-3 border-b border-slate-700 font-medium w-1/4">메모 / 특이사항</th>
                            <th class="p-3 border-b border-slate-700 font-medium">녹취듣기</th>
                        </tr>
                    </thead>
                    <tbody class="text-slate-700">
            `;

            dbs.forEach((db, index) => {
                html += `
                    <!-- 1. DB 기본 정보 줄 -->
                    <tr class="bg-slate-50 font-medium">
                        <td class="p-3 border-r border-slate-200"><span class="text-rose-500 font-bold text-xs">${db.timeLimit}</span></td>
                        <td class="p-3 border-r border-slate-200"><span class="bg-blue-100 text-blue-800 text-[11px] font-bold px-2 py-1 rounded-full">${db.region}</span></td>
                        <td class="p-3 border-r border-slate-200 font-bold text-base text-slate-900">${db.customerName}</td>
                        <td class="p-3 border-r border-slate-200 font-bold tracking-wider">${db.phone}</td>
                        <td class="p-3 border-r border-slate-200 text-left text-xs whitespace-normal break-keep text-slate-600">${db.memo}</td>
                        <td class="p-2 border-slate-200">
                            ${db.audioUrl ? 
                              `<iframe src="${db.audioUrl.replace('uc?export=download&id=', 'file/d/')}/preview" class="w-full h-10 rounded border border-slate-300"></iframe>` 
                              : `<span class="text-xs text-slate-400">녹취 파일 없음</span>`
                            }
                        </td>
                    </tr>
                    <!-- 2. DB 현황 입력 줄 -->
                    <tr class="border-b-4 border-slate-300">
                        <td colspan="6" class="p-0">
                            <table class="w-full text-xs text-center bg-white">
                                <thead class="bg-slate-100 text-slate-500">
                                    <tr>
                                        <th class="p-2 border-r border-slate-200">1차 TA(1일)</th>
                                        <th class="p-2 border-r border-slate-200">2차 TA(2일)</th>
                                        <th class="p-2 border-r border-slate-200">3차 TA(3일)</th>
                                        <th class="p-2 border-r border-slate-200">4차 이상 TA</th>
                                        <th class="p-2 border-r border-slate-200">일정(스케줄입력)</th>
                                        <th class="p-2 border-r border-slate-200">현황</th>
                                        <th class="p-2 border-r border-slate-200 w-1/5">비고</th>
                                        <th class="p-2 w-20">저장</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="p-2 border-r border-slate-200">${generateTaSelect(`ta1_${index}`)}</td>
                                        <td class="p-2 border-r border-slate-200">${generateTaSelect(`ta2_${index}`)}</td>
                                        <td class="p-2 border-r border-slate-200">${generateTaSelect(`ta3_${index}`)}</td>
                                        <td class="p-2 border-r border-slate-200">${generateTaSelect(`ta4_${index}`)}</td>
                                        <td class="p-2 border-r border-slate-200 flex items-center justify-center gap-1 h-full">
                                            <input type="text" id="schedule_${index}" placeholder="예: 7/15 14시" class="w-20 px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none">
                                            <a href="https://calendar.naver.com/" target="_blank" class="bg-emerald-500 text-white px-2 py-1.5 rounded font-bold hover:bg-emerald-600 transition" title="네이버 캘린더 열기">N캘린더</a>
                                        </td>
                                        <td class="p-2 border-r border-slate-200">
                                            <select id="status_${index}" class="w-full p-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none font-bold text-slate-700">
                                                <option value="">선택</option>
                                                <option value="상담 중">상담 중</option>
                                                <option value="상담완료">상담완료</option>
                                                <option value="계약">계약</option>
                                                <option value="장기배양(심사)">장기배양(심사)</option>
                                                <option value="거절">거절</option>
                                            </select>
                                        </td>
                                        <td class="p-2 border-r border-slate-200">
                                            <input type="text" id="note_${index}" placeholder="특이사항을 자유롭게 입력하세요" class="w-full px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none">
                                        </td>
                                        <td class="p-2">
                                            <button onclick="saveStatus('${db.customerName}', ${index})" id="btn_save_${index}" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded transition shadow-sm">저장</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        // TA 옵션 생성용 공통 함수
        function generateTaSelect(id) {
            return `
            <select id="${id}" class="w-full p-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-slate-600">
                <option value="">선택</option>
                <option value="부재">부재</option>
                <option value="다시">다시</option>
                <option value="거절">거절</option>
                <option value="예정">예정</option>
                <option value="본인설계사">본인설계사</option>
            </select>
            `;
        }

        // ⭐️ 앱스크립트로 데이터(현황, TA 등) 전송
        async function saveStatus(customerName, index) {
            const btn = document.getElementById(`btn_save_${index}`);
            btn.innerText = "저장중..";
            btn.classList.replace('bg-blue-600', 'bg-slate-400');
            btn.disabled = true;

            const payload = {
                action: "updateHyunhwang",
                agentName: currentAgent,
                customerName: customerName,
                ta1: document.getElementById(`ta1_${index}`).value,
                ta2: document.getElementById(`ta2_${index}`).value,
                ta3: document.getElementById(`ta3_${index}`).value,
                ta4: document.getElementById(`ta4_${index}`).value,
                schedule: document.getElementById(`schedule_${index}`).value,
                status: document.getElementById(`status_${index}`).value,
                note: document.getElementById(`note_${index}`).value
            };

            try {
                const response = await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if(result.success) {
                    alert(`${customerName} 고객님의 관리 현황이 시트에 실시간으로 연동되었습니다.`);
                }
            } catch (error) {
                alert("통신 에러가 발생했습니다. 잠시 후 다시 시도해주세요.");
            } finally {
                btn.innerText = "저장";
                btn.classList.replace('bg-slate-400', 'bg-blue-600');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
