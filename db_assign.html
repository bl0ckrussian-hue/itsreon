<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itsrion DB 배정 시스템 (보안 뷰어)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 보안 제어: 드래그 및 복사 방지 */
        body {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            font-family: 'Malgun Gothic', sans-serif; background-color: #f8fafc;
        }
        body.blurred { filter: blur(15px); transition: filter 0.2s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

    <!-- 상단 헤더 -->
    <header class="bg-slate-900 text-white p-5 shadow-md flex justify-between items-center sticky top-0 z-40 min-w-[1000px]">
        <div>
            <h1 class="text-xl font-black tracking-tight">나의 배정 DB 리스트 (표 형식)</h1>
            <p class="text-xs text-slate-400 mt-1">고객 정보 보호를 위해 화면 캡처 및 복사가 금지됩니다.</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="agentNameDisplay" class="font-bold text-lg text-emerald-400">로딩 중...</span>
        </div>
    </header>

    <!-- DB 리스트 표 렌더링 영역 -->
    <main class="w-full p-6 flex-grow overflow-x-auto">
        <div id="dbContainer" class="w-full min-w-[1000px]">
            <div class="text-center py-20 text-slate-500 font-bold">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </main>

    <!-- 일정 등록 팝업(모달) - 현재 스크립트의 registerCalendar 기능용 -->
    <div id="meetingModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 shadow-2xl max-w-sm w-full relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 font-bold">✕</button>
            <h3 id="modalTitle" class="text-xl font-bold text-slate-900 mb-1">일정 등록</h3>
            <p class="text-xs text-slate-500 mb-5">등록 시 진행상태가 '1차면담(성공)'으로 자동 변경됩니다.</p>
            
            <input type="hidden" id="targetCustomerName">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">미팅 날짜 및 시간</label>
                    <input type="datetime-local" id="meetingDateTime" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                
                <div class="flex gap-2 pt-2">
                    <button onclick="closeModal()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-lg transition">취소</button>
                    <button onclick="submitMeeting()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition shadow-md">달력 연동 및 저장</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- [보안 제어 로직] ---
        document.addEventListener('contextmenu', e => e.preventDefault()); 
        document.addEventListener('copy', e => { e.preventDefault(); alert('개인정보 보호를 위해 복사는 금지되어 있습니다.'); }); 
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's' || e.key === 'c')) e.preventDefault(); 
        });
        window.addEventListener('blur', () => {
            if (document.activeElement && document.activeElement.tagName === 'IFRAME') return;
            document.body.classList.add('blurred');
        });
        window.addEventListener('focus', () => document.body.classList.remove('blurred'));

        // --- [데이터 연동 핵심 로직] ---
        // ⭐️ 기존에 사용하시던 앱스크립트 웹앱 URL을 그대로 유지합니다.
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxqvmasH-avzis8xuxC2gGTbB2RW4ji1bjIqugDUvUH-ckY4_NVBxLFsM4XkJ_9-Q/exec"; 
        
        const currentAgent = localStorage.getItem('rion_logged_user');

        if (!currentAgent) {
            alert('보안 접근입니다. 메인 홈페이지에서 로그인을 먼저 진행해주세요.');
            window.close();
        } else {
            document.getElementById('agentNameDisplay').innerText = `${currentAgent} 팀장님`;
            loadAssignedDBs();
        }

        async function loadAssignedDBs() {
            try {
                const response = await fetch(`${GAS_WEBAPP_URL}?agent=${encodeURIComponent(currentAgent)}`);
                const data = await response.json();
                renderDBList(data);
            } catch (error) {
                document.getElementById('dbContainer').innerHTML = `
                    <div class="text-center py-20 text-rose-500 font-bold">
                        데이터 서버와 연결할 수 없습니다.<br><span class="text-xs mt-2 block">오류 내용: ${error.message}</span>
                    </div>`;
            }
        }

        // ⭐️ 현재 스크립트가 보내주는 정보만으로 구성한 엑셀 표 UI
        function renderDBList(dbs) {
            const container = document.getElementById('dbContainer');
            if(!dbs || dbs.length === 0) { 
                container.innerHTML = "<div class='text-center py-20 text-slate-500 font-bold'>현재 배정된 대기 DB가 없습니다.</div>"; 
                return; 
            }
            
            let html = `
            <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                <table class="w-full text-sm text-center border-collapse whitespace-nowrap">
                    <thead class="bg-slate-800 text-white">
                        <tr>
                            <th class="p-3 border-b border-slate-700 font-medium">잔여시간</th>
                            <th class="p-3 border-b border-slate-700 font-medium">지역</th>
                            <th class="p-3 border-b border-slate-700 font-medium text-amber-300">고객명</th>
                            <th class="p-3 border-b border-slate-700 font-medium">전화번호</th>
                            <th class="p-3 border-b border-slate-700 font-medium w-64">메모</th>
                            <th class="p-3 border-b border-slate-700 font-medium">TM시간</th>
                            <th class="p-3 border-b border-slate-700 font-medium text-emerald-300">현재 진행상태</th>
                            <th class="p-3 border-b border-slate-700 font-medium w-48">녹취듣기</th>
                        </tr>
                    </thead>
                    <tbody class="text-slate-700">
            `;

            dbs.forEach((db, index) => {
                html += `
                    <!-- [첫 번째 줄] 고객 기본 정보 -->
                    <tr class="bg-slate-50 border-b border-slate-200 hover:bg-slate-100 transition">
                        <td class="p-3 border-r border-slate-200"><span class="text-rose-500 font-bold text-xs">${db.timeLimit}</span></td>
                        <td class="p-3 border-r border-slate-200"><span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded-full">${db.region}</span></td>
                        <td class="p-3 border-r border-slate-200 font-bold text-base text-slate-900">${db.customerName}</td>
                        <td class="p-3 border-r border-slate-200 font-bold text-blue-600">${db.phone}</td>
                        <td class="p-3 border-r border-slate-200 text-left whitespace-normal break-keep text-xs leading-snug text-slate-600">${db.memo}</td>
                        <td class="p-3 border-r border-slate-200"><span class="bg-slate-200 px-2 py-1 rounded text-xs">${db.tmTime}</span></td>
                        <td class="p-3 border-r border-slate-200 font-black text-emerald-600">${db.taStep}</td>
                        <td class="p-2 border-slate-200">
                            ${db.audioUrl ? 
                              `<iframe src="${db.audioUrl.replace('uc?export=download&id=', 'file/d/')}/preview" class="w-full h-10 rounded border border-slate-300"></iframe>` 
                              : `<span class="text-xs text-slate-400">녹취 없음</span>`
                            }
                        </td>
                    </tr>
                    
                    <!-- [두 번째 줄] 현재 스크립트 기능(상태 변경) 지원 폼 -->
                    <tr class="border-b-4 border-slate-400">
                        <td colspan="8" class="p-0 bg-white">
                            <div class="flex items-center justify-end w-full bg-amber-50 p-2 gap-2">
                                <span class="text-xs font-bold text-slate-500 mr-2">👉 진행상태 업데이트 :</span>
                                <button onclick="openModal('${db.customerName}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 px-4 rounded text-xs transition shadow-sm">1차면담(달력 연동)</button>
                                
                                <select id="status_${index}" class="p-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs font-bold text-slate-700 bg-white">
                                    <option value="">상태 선택</option>
                                    <option value="부재">부재</option>
                                    <option value="거절">거절</option>
                                    <option value="다시">다시</option>
                                    <option value="예정">예정</option>
                                    <option value="계약">계약</option>
                                </select>
                                
                                <button onclick="updateSimpleStatus('${db.customerName}', ${index})" id="btn_save_${index}" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-1.5 px-4 rounded text-xs transition shadow-sm">저장</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        // 모달창 열기 (기존 스크립트의 N캘린더 연동용)
        function openModal(customerName) {
            document.getElementById('targetCustomerName').value = customerName;
            document.getElementById('meetingModal').classList.remove('hidden');
        }
        function closeModal() { 
            document.getElementById('meetingModal').classList.add('hidden'); 
        }

        // 달력 연동 및 상태 변경 (기존 로직)
        async function submitMeeting() {
            const customerName = document.getElementById('targetCustomerName').value;
            const dateTime = document.getElementById('meetingDateTime').value;

            if(!dateTime) { alert("날짜와 시간을 입력해주세요."); return; }

            const payload = {
                action: "registerCalendar",
                agentName: currentAgent,
                customerName: customerName,
                dateTime: dateTime
            };

            const btn = document.querySelector('#meetingModal button.bg-blue-600');
            btn.innerText = "저장 중...";

            try {
                await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                alert("일정이 등록되었고 상태가 변경되었습니다.");
                closeModal();
                loadAssignedDBs(); 
            } catch (e) {
                alert("등록 중 오류가 발생했습니다.");
            } finally {
                btn.innerText = "달력 연동 및 저장";
            }
        }

        // 단일 상태 변경 저장 (기존 로직)
        async function updateSimpleStatus(customerName, index) {
            const statusVal = document.getElementById(`status_${index}`).value;
            if(!statusVal) {
                alert("변경할 상태를 먼저 선택해주세요.");
                return;
            }

            const btn = document.getElementById(`btn_save_${index}`);
            btn.innerText = "저장중..";
            btn.classList.replace('bg-slate-800', 'bg-slate-400');
            btn.disabled = true;

            const payload = { 
                action: "updateStatus", 
                agentName: currentAgent, 
                customerName: customerName, 
                status: statusVal 
            };
            
            try {
                await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                alert(`${customerName} 고객님의 상태가 '${statusVal}'(으)로 업데이트 되었습니다.`);
                loadAssignedDBs();
            } catch(e) {
                alert("통신 에러가 발생했습니다.");
            } finally {
                btn.innerText = "저장";
                btn.classList.replace('bg-slate-400', 'bg-slate-800');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
