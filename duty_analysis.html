    <script>
        // 초기 유저 셋팅
        document.addEventListener('DOMContentLoaded', () => {
            const userName = localStorage.getItem('rion_logged_user') || '게스트';
            document.getElementById('loggedUserName').innerText = userName;
            if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        });

        let selectedPdfFiles = [];
        let currentTab1Markdown = "";

        document.getElementById('pdfDropZone').addEventListener('click', () => document.getElementById('pdfFileInput').click());

        function handlePdfSelect(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            selectedPdfFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
            document.getElementById('pdfFileNameDisplay').innerHTML = selectedPdfFiles.map(f => `📄 ${f.name}`).join('<br>');
            document.getElementById('pdfFileNameDisplay').classList.add('text-blue-600');
        }

        async function extractTextFromPdfFiles(fileList, password) {
            let combinedText = "";
            for (let i = 0; i < fileList.length; i++) {
                const file = fileList[i];
                const arrayBuffer = await file.arrayBuffer();
                try {
                    const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer, password: password || undefined });
                    const pdf = await loadingTask.promise;
                    for (let p = 1; p <= pdf.numPages; p++) {
                        const page = await pdf.getPage(p);
                        const tokenized = await page.getTextContent();
                        combinedText += tokenized.items.map(item => item.str).join(' ') + '\n';
                    }
                } catch (err) {
                    throw new Error(`PDF 읽기 실패: ${file.name} (비밀번호 오류일 수 있습니다.)`);
                }
            }
            return combinedText;
        }

        // ⭐️ 팀장님 요청 규칙을 100% 반영한 알릴의무 분석 엔진 로직
        function analyzeMedicalRecords(rawText) {
            const detectedInfo = { surgeries: [], long_term_meds: [], admissions: [], long_term_treatments: [] };
            const visitCounter = {};
            const admissionCounter = {};
            const admissionDetails = {};
            const testDetails = {}; 
            const surgeryDetails = {}; 
            const longMedDetails = {}; 
            const diseaseMedsMap = {}; 
            
            const testKeywords = ["검사료", "자체검사", "검사", "초음파", "MRI", "M.R.I", "CT", "내시경", "촬영", "생검", "엑스레이", "X-RAY", "X-ray", "조직", "검체"];
            const surgKw = ["수술", "절제", "적출", "봉합", "성형", "이식", "관혈", "비관혈", "시술", "내시경", "카테터", "신경차단", "차단술", "조영술", "시멘트", "치조골", "발치", "임플란트", "제거"];
            const dentalExcludeKeywords = ["치근활택", "치근확장", "근관확대", "스케일링", "치석", "진단및치료계획", "1단계", "방사선", "파노라마", "보철수복", "3단계", "보철"];
            const excludeKeywords = ["수술후처치", "수술재료", "수술방", "마취", "검사", "영상", "진찰료", "의학관리료", "단순처치", "질강처치", "드레싱", "물리치료", "체외충격파", "도수치료", "기본진료", "투약", "처방전", "접종", "재료대", "치주소파", "치관수복", "보철물", "ELECTRODE", "WIRE", "PROBE", "CATHETER", "TUBE", "NEEDLE", "SYRINGE", "NYLON", "SILK", "VICRYL", "POLYSORB", "STAPLER", "SUTURE", "BLADE", "KNIFE", "GAUZE", "BANDAGE", "STRIP", "CLOSURE", "HOOK", "SCREW", "PLATE", "MESH", "BURR", "SAW", "절삭기류", "드릴", "산소", "흡입", "감시", "측정", "모니터링", "심전도", "배액", "세척", "소독", "교환", "유치", "삽입", "제거", "관장", "기저귀", "마사지", "온열", "냉동", "자극", "요법", "주입로", "정맥내", "근육내", "피하", "주사", "수액", "영양제"];
            const forceInclude = ["신경차단", "차단술", "조영술", "결찰술", "박리술", "신경성형술", "고주파", "풍선확장", "후궁절제", "치환술", "절제술", "적출술", "이식술", "재건술", "감압술", "티눈", "발치", "치조골", "식립술", "매복치", "고정체", "천자"];
            
            const lines = (rawText || "").split('\n');
            let currentSection = "기본";
            const diseaseDateHospMap = {}; 
            const records = [];
            let tempRecord = "";
            const dateRegex = /(20\d{2})[-./]?(\d{2})[-./]?(\d{2})/;

            lines.forEach(line => {
                const norm = line.replace(/\s+/g, '');
                if (norm.includes("기본진료정보")) { currentSection = "기본"; return; }
                if (norm.includes("세부진료정보")) { currentSection = "세부"; return; }
                if (norm.includes("처방조제정보")) { currentSection = "처방"; return; }
                if (norm.includes("교통사고기본")) { currentSection = "교통"; return; }
                
                if (dateRegex.test(line)) {
                    if (tempRecord) records.push({ section: currentSection, text: tempRecord });
                    tempRecord = line.trim();
                } else {
                    tempRecord += " " + line.trim();
                }
            });
            if (tempRecord) records.push({ section: currentSection, text: tempRecord });

            records.forEach(record => {
                const rowText = record.text;
                currentSection = record.section;
                
                // 약국 완전 배제
                if (rowText.includes("약국")) return; 

                const parts = rowText.split(/[\t|]/).map(p => p.trim());
                const dateIdx = parts.findIndex(p => dateRegex.test(p));
                if (dateIdx === -1) return;

                const dateMatch = parts[dateIdx].match(dateRegex);
                const rowDate = `${dateMatch[1]}${dateMatch[2]}${dateMatch[3]}`;
                
                const hospital = parts[dateIdx + 1] || "";
                if (!hospital || hospital.includes("약국")) return;

                let disease = "질병미상";
                const mapKey = `${rowDate}|${hospital}`;

                if (currentSection === "기본") {
                    const inOut = parts[dateIdx + 3] || ""; 
                    const rawDisease = parts[dateIdx + 5] || ""; 
                    disease = rawDisease.replace(/^\((?:양방|한방)\)/, '').trim() || "질병미상";
                    diseaseDateHospMap[mapKey] = disease;

                    const key = `${hospital}|${disease}`;
                    const isAdmissionRow = inOut.includes("입원");
                    const isOutpatientRow = inOut.includes("외래");
                    
                    const daysStr = parts[dateIdx + 6] || "1"; 
                    const days = parseInt(daysStr.replace(/[^0-9]/g, '')) || 1;

                    if (isAdmissionRow) {
                        admissionCounter[key] = (admissionCounter[key] || 0) + days;
                        if (!admissionDetails[key]) admissionDetails[key] = new Set();
                        admissionDetails[key].add(`${rowDate}(${days}일)`);
                    } else if (isOutpatientRow) {
                        // 외래 항목의 '내원일수' 합산
                        if (!visitCounter[key]) visitCounter[key] = {};
                        visitCounter[key][rowDate] = Math.max(visitCounter[key][rowDate] || 0, days);
                    }
                } 
                else if (currentSection === "세부") {
                    disease = diseaseDateHospMap[mapKey] || "질병미상";
                    const key = `${hospital}|${disease}`;
                    
                    const category = parts[dateIdx + 2] || ""; 
                    let codeName = parts[dateIdx + 3] || "";   
                    if (!codeName && parts.length > dateIdx + 4) codeName = parts[dateIdx + 4];

                    if (category.includes("검사") || category.includes("영상") || category.includes("초음파") || testKeywords.some(k => codeName.includes(k))) {
                        if (!testDetails[key]) testDetails[key] = new Set();
                        testDetails[key].add(`[${rowDate}] ${codeName}`);
                    }

                    // 수술명 원문 100% 핀셋 추출
                    let isSurgeryCandidate = false;
                    if (forceInclude.some(k => codeName.includes(k))) {
                        isSurgeryCandidate = true;
                    } else if (surgKw.some(k => codeName.includes(k))) {
                        if (!excludeKeywords.some(k => codeName.includes(k) || category.includes(k)) && 
                            !dentalExcludeKeywords.some(k => codeName.includes(k))) {
                            isSurgeryCandidate = true;
                        }
                    }

                    if (isSurgeryCandidate) {
                        const cleanCodeName = codeName.trim();
                        detectedInfo.surgeries.push(`[${rowDate}] ${hospital} : ${cleanCodeName}`);
                        if (!surgeryDetails[key]) surgeryDetails[key] = new Set();
                        surgeryDetails[key].add(`[${rowDate}] ${cleanCodeName}`);
                    }
                } 
                else if (currentSection === "처방") {
                    disease = diseaseDateHospMap[mapKey] || "질병미상";
                    const key = `${hospital}|${disease}`;
                    
                    const medName = parts[dateIdx + 3] || "";   
                    const medDaysStr = parts[dateIdx + 7] || "0"; 
                    const medDays = parseInt(medDaysStr.replace(/[^0-9]/g, '')) || 0;
                    
                    if (medDays > 0) {
                        if (!longMedDetails[key]) longMedDetails[key] = {};
                        // 같은 날짜 처방은 최대 1번만 합산
                        longMedDetails[key][rowDate] = Math.max(longMedDetails[key][rowDate] || 0, medDays);
                        
                        if (medName) {
                            if (!diseaseMedsMap[disease]) diseaseMedsMap[disease] = new Set();
                            diseaseMedsMap[disease].add(medName);
                        }
                    }
                }
            });

            for (let dis in diseaseMedsMap) {
                detectedInfo.long_term_meds.push(`[진단명: ${dis}] 처방 약품: ${Array.from(diseaseMedsMap[dis]).join(', ')}`);
            }

            const medSumDetails = {};
            for (let k in longMedDetails) {
                let total = 0;
                for (let d in longMedDetails[k]) total += longMedDetails[k][d];
                medSumDetails[k] = total;
            }

            return { detectedInfo, visitCounter, admissionCounter, admissionDetails, testDetails, surgeryDetails, longMedDetails, medSumDetails };
        }

        function buildOriginalAnalysisPrompt(rawText, analysisData, fileNames) {
            const { detectedInfo = {}, visitCounter = {}, admissionCounter = {}, admissionDetails = {}, testDetails = {}, surgeryDetails = {}, medSumDetails = {} } = analysisData || {};
            
            // 기준일: 현재 KST
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const today = new Date(utc + (9 * 60 * 60 * 1000)); 

            const diffDaysFn = (dateStr) => {
                if (!dateStr || dateStr.length < 8) return 9999;
                const dt = new Date(parseInt(dateStr.substring(0, 4)), parseInt(dateStr.substring(4, 6)) - 1, parseInt(dateStr.substring(6, 8)));
                const diffTime = today.getTime() - dt.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                return diffDays >= 0 ? diffDays : 9999; 
            };

            const allKeys = new Set([...Object.keys(visitCounter || {}), ...Object.keys(admissionCounter || {}), ...Object.keys(surgeryDetails || {}), ...Object.keys(medSumDetails || {})]);
            const diseaseAgg = {};
            
            allKeys.forEach(k => {
                const parts = k.split('|');
                if(parts.length < 2) return;
                const hosp = parts[0];
                const dis = parts[1];
                
                if (!diseaseAgg[dis]) diseaseAgg[dis] = { hospitals: new Set(), visitDict: {}, admits: [], surgs: [], tests: [], meds: 0 };
                diseaseAgg[dis].hospitals.add(hosp);
                
                if (visitCounter[k]) {
                    for (let d in visitCounter[k]) {
                        diseaseAgg[dis].visitDict[d] = Math.max(diseaseAgg[dis].visitDict[d] || 0, visitCounter[k][d]);
                    }
                }
                if (admissionDetails[k]) admissionDetails[k].forEach(e => diseaseAgg[dis].admits.push(`[${hosp}] ${e}`));
                if (surgeryDetails[k]) surgeryDetails[k].forEach(e => diseaseAgg[dis].surgs.push(`[${hosp}] ${e}`));
                if (testDetails[k]) testDetails[k].forEach(e => diseaseAgg[dis].tests.push(e));
                if (medSumDetails[k]) diseaseAgg[dis].meds += medSumDetails[k];
            });

            const sortedHints = [];
            
            for (let dis in diseaseAgg) {
                const agg = diseaseAgg[dis];
                const hospitals = Array.from(agg.hospitals).join(', ');
                const allVisitDates = Object.keys(agg.visitDict).sort();
                
                let totalVisitCnt = 0;
                allVisitDates.forEach(d => totalVisitCnt += agg.visitDict[d]);
                
                let validVisitCnt = 0; 
                const yearlyVisits = {};
                
                allVisitDates.forEach(d => {
                    const diff = diffDaysFn(d);
                    if (diff >= 0 && diff <= 365 * 5) {
                        const days = agg.visitDict[d];
                        validVisitCnt += days;
                        const y = d.substring(0, 4);
                        yearlyVisits[y] = (yearlyVisits[y] || 0) + days;
                    }
                });
                
                let visitStr = `${totalVisitCnt}회`;
                if (validVisitCnt >= 7 && Object.keys(yearlyVisits).length > 0) {
                    const yearList = Object.keys(yearlyVisits).sort().reverse().map(y => `${y}년(${yearlyVisits[y]}회)`).join(', ');
                    visitStr = `${totalVisitCnt}회<br>(${yearList})`;
                }

                const validAdmits = agg.admits.filter(e => {
                    const m = e.match(/\[(\d{8})\]/);
                    if(m) { const diff=diffDaysFn(m[1]); return diff>=0 && diff<=365*5; }
                    return false;
                });

                const validSurgs = agg.surgs.filter(e => {
                    const m = e.match(/\[(\d{8})\]/);
                    return m && diffDaysFn(m[1]) >= 0 && diffDaysFn(m[1]) <= 365 * 5;
                });

                let isTarget = false;
                let priority = 99;
                const reason = [];

                if (validAdmits.length > 0) { isTarget = true; reason.push("입원"); priority = Math.min(priority, 1); }
                if (validSurgs.length > 0) { isTarget = true; reason.push("수술"); priority = Math.min(priority, 1); }
                if (agg.meds >= 30) { isTarget = true; reason.push("30일이상투약"); priority = Math.min(priority, 2); }
                if (validVisitCnt >= 7) { isTarget = true; reason.push("7일이상치료"); priority = Math.min(priority, 3); }

                if (allVisitDates.length > 0) {
                    const lastDtStr = allVisitDates[allVisitDates.length - 1];
                    if (diffDaysFn(lastDtStr) >= 0 && diffDaysFn(lastDtStr) <= 90) { isTarget = true; reason.push("3개월내내원"); priority = Math.min(priority, 5); }
                }

                const uniqueTestDays1Y = new Set();
                agg.tests.forEach(evt => {
                    const match = evt.match(/\[(\d{8})\]/);
                    if (match) {
                        const diff = diffDaysFn(match[1]);
                        if (diff >= 0 && diff <= 365) uniqueTestDays1Y.add(match[1]);
                    }
                });
                if (uniqueTestDays1Y.size > 0) { isTarget = true; reason.push("1년내 검사"); priority = Math.min(priority, 4); }

                if (!isTarget) continue;

                const reasonStr = reason.join(', ');
                let admitDetailStr = validAdmits.length > 0 ? ` [입원상세: ${validAdmits.join(', ')}]` : "";
                let surgStr = validSurgs.length > 0 ? ` [수술명: ${validSurgs.join(', ')}]` : "";
                
                const lineText = `- [${dis}] (관련병원: ${hospitals}) -> 외래:${visitStr} / 입원:${validAdmits.length}건${admitDetailStr} / 투약:${agg.meds}일${surgStr} -> [비고사유: ${reasonStr}]`;
                sortedHints.push({ priority, lineText });

        async function callGeminiApi(promptText, key) {
            const proxyUrl = "https://script.google.com/macros/s/AKfycbwz9QL6wb6GUlgygtnMOwsvXzbA2eZuhx-JIXQc-1TZCiAWZdV0IUxaqg7GbcMoO72P/exec";
            const maxRetries = 3;

            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const res = await fetch(proxyUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ prompt: promptText })
                    });
                    const responseText = await res.text();
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch (e) {
                        throw new Error("서버 연동 시간 초과 또는 과부하입니다. 다시 시도해주세요.");
                    }
                    if (data && data.candidates && data.candidates.length > 0) {
                        return data.candidates[0].content.parts[0].text;
                    }
                    if (data && data.error) throw new Error(data.error.message);
                    if (data && data.result) return data.result;
                    throw new Error("예상치 못한 응답 형태입니다.");
                } catch (e) {
                    if (attempt === maxRetries - 1) throw new Error(`${e.message}`);
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }

            let progressTimer = null;
            let currentP = 0;
            function startFakeProgress(start, cap, intervalSpeed) {
                currentP = start;
                if(progressTimer) clearInterval(progressTimer);
                progressTimer = setInterval(() => {
                    if (currentP < cap) {
                        currentP += 1;
                        progressBar.style.width = currentP + '%';
                        progressPercent.innerText = currentP + '%';
                    }
                }, intervalSpeed);
            }

            try {
                progressText.innerText = `📄 문서 추출 및 정밀 분석 중...`;
                startFakeProgress(0, 40, 100); 

                const fullText = await extractTextFromPdfFiles(selectedPdfFiles, pdfPassword);

                progressText.innerText = "⚙️ [v6.0 Rule Engine] 데이터 필터링 및 교차 집계 중...";
                startFakeProgress(40, 70, 150); 

                const analysisData = analyzeMedicalRecords(fullText);
                const { prompt: promptTab1 } = buildOriginalAnalysisPrompt(fullText, analysisData, "");
                
                progressText.innerText = "🤖 AI 엔진이 표준 알릴의무 보고서를 작성 중입니다...";
                startFakeProgress(70, 95, 800); 

                const aiMarkdown1 = await callGeminiApi(promptTab1, apiKey);
                currentTab1Markdown = aiMarkdown1;

                if(progressTimer) clearInterval(progressTimer);
                progressBar.style.width = '100%';
                progressPercent.innerText = '100%';
                progressText.innerText = "✨ 분석 완료!";

                setTimeout(() => {
                    progressArea.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                    reportBox1.innerHTML = window.marked ? window.marked.parse(aiMarkdown1) : `<pre>${aiMarkdown1}</pre>`;
                }, 500);

            } catch (error) {
                if(progressTimer) clearInterval(progressTimer);
                progressArea.classList.add('hidden');
                alert(`❌ 오류 발생: ${error.message}`);
            }
        }
