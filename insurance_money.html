<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잇츠리온 - 못 받은 보험금 찾기</title>
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --primary-color: #1e3a8a; /* 잇츠리온 블루 */
            --secondary-color: #3b82f6;
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
        }
        .btn-link {
            background-color: #10b981;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-link:hover { background-color: #059669; }
        
        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group input[type="file"], .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-analyze {
            grid-column: span 3;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-analyze:hover { background-color: var(--secondary-color); }
        
        .result-dashboard {
            text-align: center;
            margin-bottom: 30px;
        }
        .total-amount-box {
            display: inline-block;
            background: #fffbeb;
            border: 2px solid #f59e0b;
            color: #d97706;
            padding: 20px 40px;
            border-radius: 10px;
        }
        .total-amount-box h2 { margin: 0 0 10px 0; font-size: 18px; }
        .total-amount-box .amount { font-size: 36px; font-weight: bold; }
        
        .table-container { margin-bottom: 40px; overflow-x: auto; }
        .table-container h3 {
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
        }
        th { background-color: #f1f5f9; color: #334155; }
        td[contenteditable="true"] {
            background-color: #fffbdd;
            outline: none;
        }
        td[contenteditable="true"]:focus { border: 2px solid #f59e0b; }
        .row-paid { background-color: #f3f4f6; color: #9ca3af; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>잇츠리온 - 못 받은 보험금 찾기 엔진</h1>
        <a href="https://www.credit4u.or.kr:2443/" target="_blank" class="btn-link">실손지급내역 확인하기</a>
    </div>

    <div class="upload-section">
        <div class="form-group">
            <label for="basicMedFile">1. 기본진료정보 (PDF)</label>
            <input type="file" id="basicMedFile" accept="application/pdf">
        </div>
        <div class="form-group">
            <label for="creditInfoFile">2. 실손지급전체 (PDF)</label>
            <input type="file" id="creditInfoFile" accept="application/pdf">
        </div>
        <div class="form-group">
            <label for="silsoneType">3. 가입한 실손의료비 기준</label>
            <select id="silsoneType">
                <option value="1">1세대 (2009년 8월 이전 - 본인부담금 0원/5천원)</option>
                <option value="2">2세대 (2009년 8월~2017년 3월 - 10%/20% 공제)</option>
                <option value="3">3세대 (2017년 4월~2021년 6월 - 급여 10%/비급여 20% 공제)</option>
                <option value="4">4세대 (2021년 7월 이후 - 급여 20%/비급여 30% 공제)</option>
            </select>
        </div>
        <button class="btn-analyze" onclick="startAnalysis()">데이터 분석 및 매칭 시작</button>
    </div>

    <div class="result-dashboard" id="dashboardSection" style="display: none;">
        <div class="total-amount-box">
            <h2>최대청구가능금액</h2>
            <div class="amount" id="totalClaimableAmount">0원</div>
        </div>
    </div>

    <div class="table-container" id="unclaimedSection" style="display: none;">
        <h3>청구 가능 리스트 (미청구 내역 - 수정 가능)</h3>
        <table id="unclaimedTable">
            <thead>
                <tr>
                    <th>진료 시작일</th>
                    <th>병·의원&약국</th>
                    <th>주상병코드</th>
                    <th>주상병명</th>
                    <th>내가 낸 의료비</th>
                    <th>예상 공제금액</th>
                    <th>청구 가능 금액</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="table-container" id="paidSection" style="display: none;">
        <h3>기지급 리스트 (청구 완료 내역)</h3>
        <table id="paidTable">
            <thead>
                <tr>
                    <th>원사고발생일시 (진료일)</th>
                    <th>병·의원&약국</th>
                    <th>지급 회사명</th>
                    <th>총지급금액</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // PDF.js 설정
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    async function extractTextFromPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';
        
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');
            fullText += pageText + '\n';
        }
        return fullText;
    }

    // 모의 데이터 파싱 함수 (실제 환경에서는 정규식(Regex)을 PDF 표 간격에 맞춰 정교하게 조정해야 합니다)
    function parseBasicMedData(text) {
        // [원칙 3/4] 원문 데이터 그대로 추출 - 실제 포맷에 맞춘 파싱 로직 필요
        // 예시 배열 반환: [{ date: '2023-10-01', hospital: 'OO내과', code: 'J209', name: '급성 기관지염', cost: 25000 }]
        let mockData = [
            { date: '2023-10-01', hospital: '서울아산병원', code: 'J209', name: '급성 기관지염', cost: 85000 },
            { date: '2023-10-15', hospital: '종로약국', code: 'J209', name: '급성 기관지염', cost: 12000 },
            { date: '2023-11-05', hospital: '강남정형외과', code: 'M545', name: '요통', cost: 150000 },
            { date: '2023-12-10', hospital: '연세내과', code: 'K219', name: '위식도역류질환', cost: 20000 }
        ];
        return mockData;
    }

    function parseCreditData(text) {
        // [원칙 3] 회사명, 원사고발생일시, 총지급금액만 추출
        let mockData = [
            { date: '2023-10-01', company: '에이플러스손해보험', paidAmount: 65000 },
            { date: '2023-10-15', company: '에이플러스손해보험', paidAmount: 4000 }
        ];
        return mockData;
    }

    // 실손 세대별 예상 공제금액 계산기 (기본 가이드라인)
    function calculateDeduction(cost, type, hospitalName) {
        let deduction = 0;
        let typeNum = parseInt(type);
        
        // 약국인지 병원인지 이름으로 기본 유추
        let isPharmacy = hospitalName.includes('약국');
        
        if (typeNum === 1) {
            deduction = 5000; // 1세대 외래/약국 기본 5천원 공제 가정
        } else if (typeNum === 2 || typeNum === 3) {
            deduction = isPharmacy ? 8000 : 15000; // 병원급별(의원 1만, 병원 1.5만) 임의 1.5만 / 약국 8천원 
            let percentDeduction = cost * 0.1; // 10%~20%
            deduction = Math.max(deduction, percentDeduction);
        } else if (typeNum === 4) {
            deduction = cost * 0.2; // 4세대 급여/비급여 20~30% 공제 (일괄 20%로 예시 적용)
        }

        // 공제액이 내가 낸 의료비보다 크면 의료비 전체가 공제액 (청구금액 0원)
        return Math.min(deduction, cost); 
    }

    // insurance_money.html 내부 startAnalysis() 함수 교체
async function startAnalysis() {
    const basicFile = document.getElementById('basicMedFile').files[0];
    const creditFile = document.getElementById('creditInfoFile').files[0];
    const silsoneType = document.getElementById('silsoneType').value;

    if (!basicFile || !creditFile) {
        alert('두 개의 PDF 파일을 모두 업로드 해주세요.');
        return;
    }

    // 버튼 상태 변경
    const btn = document.querySelector('.btn-analyze');
    btn.innerText = "데이터 분석 중... (잠시만 기다려주세요)";
    btn.disabled = true;

    // PDF 파일을 Base64로 변환하는 내부 함수
    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });

    try {
        const basicBase64 = await toBase64(basicFile);
        const creditBase64 = await toBase64(creditFile);

        // 알려주신 구글 클라우드 런 API 주소 반영
        const CLOUD_RUN_URL = "https://insurancemoney-225817792244.asia-northeast3.run.app";

        const response = await fetch(CLOUD_RUN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                files_data: [basicBase64, creditBase64],
                password: '' 
            })
        });

        if (!response.ok) throw new Error("서버 데이터 추출 중 오류가 발생했습니다.");
        
        const data = await response.json();
        
        // 백엔드에서 파싱되어 돌아온 데이터
        const basicRecords = data.basicRecords || [];
        const creditRecords = data.creditRecords || [];

        let unclaimedRecords = [];
        let paidRecords = [];

        // 추출된 데이터로 기지급 및 미청구 분리 매칭
        basicRecords.forEach(basic => {
            const matchedCredit = creditRecords.find(credit => credit.date === basic.date);
            
            if (matchedCredit) {
                paidRecords.push({
                    date: basic.date,
                    hospital: basic.hospital,
                    company: matchedCredit.company,
                    paidAmount: matchedCredit.paidAmount
                });
            } else {
                let deduction = calculateDeduction(basic.cost, silsoneType, basic.hospital);
                let claimable = basic.cost - deduction;
                
                if(claimable > 0) {
                    unclaimedRecords.push({
                        date: basic.date,
                        hospital: basic.hospital,
                        code: basic.code,
                        name: basic.name,
                        cost: basic.cost,
                        deduction: deduction,
                        claimable: claimable
                    });
                }
            }
        });

        // 병원 이름 오름차순 정렬
        unclaimedRecords.sort((a, b) => a.hospital.localeCompare(b.hospital));

        // 화면 렌더링 호출
        renderTables(unclaimedRecords, paidRecords);

    } catch (error) {
        alert(error.message);
    } finally {
        // 버튼 원상복구
        btn.innerText = "데이터 분석 및 매칭 시작";
        btn.disabled = false;
    }
}

    function renderTables(unclaimed, paid) {
        document.getElementById('dashboardSection').style.display = 'block';
        document.getElementById('unclaimedSection').style.display = 'block';
        document.getElementById('paidSection').style.display = 'block';

        const unclaimedTbody = document.querySelector('#unclaimedTable tbody');
        const paidTbody = document.querySelector('#paidTable tbody');
        unclaimedTbody.innerHTML = '';
        paidTbody.innerHTML = '';

        let total = 0;

        // [원칙 5, 원칙 6] 추출된 데이터 표 삽입 및 내용 수정(contenteditable) 허용
        unclaimed.forEach(record => {
            total += record.claimable;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td contenteditable="true">${record.date}</td>
                <td contenteditable="true">${record.hospital}</td>
                <td contenteditable="true">${record.code}</td>
                <td contenteditable="true">${record.name}</td>
                <td contenteditable="true">${record.cost.toLocaleString()}원</td>
                <td contenteditable="true">${record.deduction.toLocaleString()}원</td>
                <td contenteditable="true" style="color:#d97706; font-weight:bold;" onblur="updateTotal()">${record.claimable.toLocaleString()}</td>
            `;
            unclaimedTbody.appendChild(tr);
        });

        paid.forEach(record => {
            const tr = document.createElement('tr');
            tr.className = 'row-paid';
            tr.innerHTML = `
                <td>${record.date}</td>
                <td>${record.hospital}</td>
                <td>${record.company}</td>
                <td>${record.paidAmount.toLocaleString()}원</td>
            `;
            paidTbody.appendChild(tr);
        });

        document.getElementById('totalClaimableAmount').innerText = total.toLocaleString() + '원';
    }

    // 셀 내용(금액) 수정 시 총합 자동 재계산 로직
    function updateTotal() {
        const rows = document.querySelectorAll('#unclaimedTable tbody tr');
        let newTotal = 0;
        rows.forEach(row => {
            // 마지막 셀(청구가능금액)의 텍스트에서 콤마와 원자를 제거하고 숫자로 변환
            let valText = row.cells[6].innerText.replace(/[^0-9]/g, '');
            let val = parseInt(valText) || 0;
            newTotal += val;
        });
        document.getElementById('totalClaimableAmount').innerText = newTotal.toLocaleString() + '원';
    }
</script>

</body>
</html>
