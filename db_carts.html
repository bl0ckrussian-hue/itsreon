<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itsrion DB 배정 시스템 및 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            font-family: 'Malgun Gothic', sans-serif; background-color: #f8fafc;
        }
        body.blurred { filter: blur(15px); transition: filter 0.2s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar relative">

    <header class="bg-slate-900 text-white p-4 xl:p-5 shadow-md flex justify-between items-center sticky top-0 z-40 w-full xl:min-w-[1400px]">
        <div>
            <h1 class="text-lg xl:text-xl font-black tracking-tight">나의 실적 대시보드 & DB 리스트</h1>
            <p class="text-[10px] xl:text-xs text-slate-400 mt-1">고객 정보 보호를 위해 화면 캡처 및 복사가 금지됩니다.</p>
        </div>
        <div class="flex items-center gap-2 xl:gap-3">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="agentNameDisplay" class="font-bold text-sm xl:text-lg text-emerald-400">로딩 중...</span>
        </div>
    </header>

    <main class="w-full p-3 xl:p-6 flex-grow pb-32 xl:min-w-[1400px] mx-auto max-w-7xl">
        
        <!-- 대시보드 영역 -->
        <div id="dashboardSection" class="mb-10 hidden">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-2xl font-black text-slate-800"><span id="dashName" class="text-blue-600"></span> 전문가님</h2>
                <div class="flex gap-4">
                    <div class="bg-blue-50 px-4 py-2 rounded-lg border border-blue-100 text-right">
                        <span class="text-[11px] text-blue-600 font-bold block">종합체결률</span>
                        <span class="text-xl font-black text-slate-800"><span id="dashRate">0</span>%</span>
                    </div>
                    <div class="bg-indigo-50 px-4 py-2 rounded-lg border border-indigo-100 text-right">
                        <span class="text-[11px] text-indigo-600 font-bold block">당월소진DB</span>
                        <span class="text-xl font-black text-slate-800"><span id="dashConsumed">0</span>건</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 xl:grid-cols-5 gap-3 xl:gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                    <span class="text-[11px] text-slate-500 font-bold tracking-tight block">당월 누적 보험료</span>
                    <div class="text-lg xl:text-xl font-black text-slate-800 mt-1"><span id="dashPremium">0</span>원</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                    <span class="text-[11px] text-slate-500 font-bold tracking-tight block">계약체결건수</span>
                    <div class="text-lg xl:text-xl font-black text-slate-800 mt-1"><span id="dashContract">0</span>건</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                    <span class="text-[11px] text-slate-500 font-bold tracking-tight block">평균상담소요기간</span>
                    <div class="text-lg xl:text-xl font-black text-slate-800 mt-1"><span id="dashAvgDays">0</span>일</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                    <span class="text-[11px] text-slate-500 font-bold tracking-tight block">당월배정DB수량</span>
                    <div class="text-lg xl:text-xl font-black text-slate-800 mt-1"><span id="dashAssigned">0</span>건</div>
                </div>
                <div class="bg-emerald-50 p-4 rounded-xl shadow-sm border border-emerald-100 text-center">
                    <span class="text-[11px] text-emerald-600 font-bold tracking-tight block">진행중 상담 건수</span>
                    <div class="text-lg xl:text-xl font-black text-emerald-800 mt-1"><span id="dashOngoing">0</span>건</div>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <div class="bg-white p-4 xl:p-5 rounded-xl shadow-sm border border-slate-200 xl:col-span-1">
                    <h3 class="text-sm font-bold text-slate-700 mb-4 tracking-tight">📊 DB TA 상황별 건수 (3개월 누적)</h3>
                    <div class="h-56 relative w-full"><canvas id="barChart"></canvas></div>
                </div>
                <div class="bg-white p-4 xl:p-5 rounded-xl shadow-sm border border-slate-200 xl:col-span-2">
                    <h3 class="text-sm font-bold text-slate-700 mb-4 tracking-tight">📈 월별 DB소진수량 vs 체결건수</h3>
                    <div class="h-56 relative w-full"><canvas id="lineChart"></canvas></div>
                </div>
            </div>
            <div class="border-t-2 border-slate-200 border-dashed w-full my-8"></div>
        </div>

        <!-- 기존 DB 리스트 영역 -->
        <div id="dbContainer" class="w-full">
            <div class="text-center py-20 text-slate-500 font-bold">
                데이터를 불러오는 중입니다...
            </div>
        </div>
    </main>

    <!-- 계약 정보 입력 모달 -->
    <div id="contractModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-800 p-4 flex justify-between items-center text-white">
                <h2 class="font-bold text-lg">📝 계약 세부 정보 입력</h2>
                <div class="flex gap-2">
                    <button onclick="addContractRow()" class="bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 rounded font-bold text-xs transition">➕ 추가</button>
                    <button onclick="removeContractRow()" class="bg-rose-500 hover:bg-rose-600 px-3 py-1.5 rounded font-bold text-xs transition">➖ 삭제</button>
                </div>
            </div>
            <div class="p-5 overflow-y-auto bg-slate-50 custom-scrollbar flex-grow" id="contractRowsContainer"></div>
            <div class="bg-white p-4 border-t border-slate-200 flex justify-end gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                <button onclick="closeContractModal()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold text-sm text-slate-700 transition">취소</button>
                <button onclick="confirmContractModal()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-sm shadow-md transition">✅ 확인 및 계산</button>
            </div>
        </div>
    </div>

    <!-- 전체 저장 버튼 -->
    <div class="fixed bottom-6 right-6 xl:bottom-10 xl:right-10 z-50">
        <button id="globalSaveBtn" onclick="saveAllChanges()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-5 xl:py-4 xl:px-8 rounded-full shadow-[0_10px_25px_-5px_rgba(37,99,235,0.6)] transition-all hover:scale-105 flex items-center gap-2 xl:gap-3 border-2 border-white">
            <span id="globalSaveText" class="text-sm xl:text-[15px] tracking-wide">💾 전체 저장</span>
        </button>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault()); 
        document.addEventListener('copy', e => { e.preventDefault(); alert('개인정보 보호를 위해 복사는 금지되어 있습니다.'); }); 
        document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's' || e.key === 'c')) e.preventDefault(); });
        
        // ⭐️ 기존 웹앱 URL로 반드시 교체해 주세요!
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwExEQ6C2ItIbyp72hWOWJ-nALTY969Q4Nh86ngb1_zOGp91fr5mrshyv8EAwafG0XG/exec"; 
        
        // 메인 페이지에서 저장해둔 접속자 이름 불러오기
        const currentAgent = localStorage.getItem('rion_logged_user');
        
        let modifiedRows = new Set(); 
        let currentModalIndex = null; 
        let currentModalPrefix = ''; 
        let barChartInst = null;
        let lineChartInst = null;

        if (!currentAgent) {
            document.getElementById('dbContainer').innerHTML = "<div class='text-center py-20 text-rose-500 font-bold'>권한이 없습니다. 메인 홈페이지에서 로그인을 진행해주세요.</div>";
        } else {
            document.getElementById('agentNameDisplay').innerText = `${currentAgent} 팀장님 접속중`;
            loadData();
        }

        async function loadData() {
            modifiedRows.clear(); 
            try {
                // 1. 대시보드 통계 불러오기
                const dashRes = await fetch(`${GAS_WEBAPP_URL}?agent=${encodeURIComponent(currentAgent)}&mode=dashboard`);
                const dashData = await dashRes.json();
                renderDashboard(dashData);

                // 2. DB 리스트 데이터 불러오기
                const listRes = await fetch(`${GAS_WEBAPP_URL}?agent=${encodeURIComponent(currentAgent)}`);
                const listData = await listRes.json();
                renderDBList(listData);

            } catch (error) {
                document.getElementById('dbContainer').innerHTML = `<div class="text-center py-20 text-rose-500 font-bold">데이터 서버 오류<br><span class="text-xs mt-2 block">${error.message}</span></div>`;
            }
        }

        function renderDashboard(data) {
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('dashName').innerText = data.agentName;
            document.getElementById('dashRate').innerText = data.conversionRate;
            document.getElementById('dashConsumed').innerText = data.consumedAll;
            
            document.getElementById('dashPremium').innerText = Number(data.totalPremiumThisMonth).toLocaleString();
            document.getElementById('dashContract').innerText = data.contractCount;
            document.getElementById('dashAvgDays').innerText = data.avgConsultDays;
            document.getElementById('dashAssigned').innerText = data.assignedThisMonth;
            document.getElementById('dashOngoing').innerText = data.ongoingCount;

            const barCtx = document.getElementById('barChart').getContext('2d');
            if(barChartInst) barChartInst.destroy();
            barChartInst = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['부재/다시', '거절(단박)', '예정', '상담중(장기)', '상담완료(계약)'],
                    datasets: [{ label: '건수', data: data.taStats, backgroundColor: ['#94a3b8', '#f43f5e', '#f59e0b', '#3b82f6', '#10b981'], borderRadius: 6 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
            });

            const lineCtx = document.getElementById('lineChart').getContext('2d');
            if(lineChartInst) lineChartInst.destroy();
            lineChartInst = new Chart(lineCtx, {
                type: 'line',
                data: {
                    labels: data.monthlyTrend.labels,
                    datasets: [
                        { label: '소진수량', data: data.monthlyTrend.consumed, borderColor: '#6366f1', backgroundColor: '#6366f1', tension: 0.3, borderWidth: 3 },
                        { label: '체결건수', data: data.monthlyTrend.contracted, borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.3, borderWidth: 3 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
            });
        }

        function renderDBList(dbs) {
            const container = document.getElementById('dbContainer');
            if(!dbs || dbs.length === 0) { 
                container.innerHTML = "<div class='text-center py-20 text-slate-500 font-bold'>현재 배정된 대기 DB가 없습니다.</div>"; return; 
            }
            let desktopHtml = ''; let mobileHtml = '';

            dbs.forEach((db, index) => {
                const valTa1 = db.ta1 || ''; const valTa2 = db.ta2 || '';
                const valTa3 = db.ta3 || ''; const valTa4 = db.ta4 || '';
                const valStatus = db.status || '';
                const valCount = db.contractCount ? db.contractCount + '건' : '';
                const valPremium = db.contractPremium ? Number(db.contractPremium).toLocaleString() + '원' : '';
                const valNote = db.note || ''; const valSchedule = db.schedule || '';

                desktopHtml += `
                    <tr class="bg-slate-50 font-medium border-b border-slate-200 hover:bg-slate-100 transition">
                        <td class="p-2 border-r border-slate-200 font-bold text-slate-500">${index + 1}</td>
                        <td class="p-2 border-r border-slate-200">${db.assignDate || '-'}</td>
                        <td class="p-2 border-r border-slate-200 font-bold text-blue-600">${db.phone || '-'}</td>
                        <td class="p-2 border-r border-slate-200"><span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-1.5 py-0.5 rounded">${db.region || '-'}</span></td>
                        <td class="p-2 border-r border-slate-200 font-bold text-sm text-slate-900">${db.customerName || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.sido || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.gugun || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.dong || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.birth || '-'}</td>
                        <td class="p-2 border-r border-slate-200">${db.gender || '-'}</td>
                        <td class="p-2 border-r border-slate-200 text-left whitespace-normal break-keep text-[11px] leading-snug">${db.memo || '-'}</td>
                        <td class="p-2 border-r border-slate-200 font-bold">${currentAgent}</td>
                        <td class="p-2 border-r border-slate-200 font-bold text-emerald-600">${valStatus || '-'}</td>
                        <td class="p-2 border-r border-slate-200 text-[10px]">${db.assignDateTime || '-'}</td>
                        <td class="p-2"><span class="text-rose-600 font-black text-[11px]">${db.timeLimit || '-'}</span></td>
                    </tr>
                    <tr class="border-b-4 border-slate-400">
                        <td colspan="15" class="p-0 bg-white">
                            <input type="hidden" id="custName_${index}" value="${db.customerName}">
                            <div id="edit_area_${index}" class="flex items-center w-full bg-amber-50 p-2 gap-2 transition-all">
                                <div class="w-[20%] shrink-0 flex items-center gap-1.5 pl-1">
                                    <span class="text-[11px] font-bold text-slate-700 whitespace-nowrap shrink-0 tracking-tight">🎧 녹취듣기</span>
                                    <div class="flex-grow w-full">
                                        ${db.audioUrl ? `<iframe src="${db.audioUrl.replace('uc?export=download&id=', 'file/d/')}/preview" class="w-full h-8 rounded border border-slate-300 bg-white shadow-sm"></iframe>` : `<div class="w-full h-8 flex items-center justify-center bg-slate-100 rounded border border-slate-200 text-[10px] text-slate-400 shadow-inner">녹취 없음</div>`}
                                    </div>
                                </div>
                                <div class="w-[8%] shrink-0">${generateTaSelect(`ta1_${index}`, '1차 TA', valTa1, index, '')}</div>
                                <div class="w-[8%] shrink-0">${generateTaSelect(`ta2_${index}`, '2차 TA', valTa2, index, '')}</div>
                                <div class="w-[8%] shrink-0">${generateTaSelect(`ta3_${index}`, '3차 TA', valTa3, index, '')}</div>
                                <div class="w-[8%] shrink-0">${generateTaSelect(`ta4_${index}`, '4차 이상', valTa4, index, '')}</div>
                                
                                <div class="w-[10%] shrink-0">
                                    <input type="text" id="schedule_${index}" value="${valSchedule}" onchange="markModified(${index})" placeholder="일정입력" class="w-full px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs">
                                </div>
                                <div class="w-[10%] shrink-0">
                                    <select id="status_${index}" onchange="handleStatusChange(${index}, '')" class="w-full p-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs font-bold text-slate-700 bg-white">
                                        <option value="" ${valStatus===''?'selected':''}>- 진행현황 -</option>
                                        <option value="상담 중" ${valStatus==='상담 중'?'selected':''}>상담 중</option>
                                        <option value="상담완료" ${valStatus==='상담완료'?'selected':''}>상담완료</option>
                                        <option value="계약" ${valStatus==='계약'?'selected':''}>계약</option>
                                        <option value="장기배양(심사)" ${valStatus==='장기배양(심사)'?'selected':''}>장기배양(심사)</option>
                                        <option value="거절" ${valStatus==='거절'?'selected':''}>거절</option>
                                    </select>
                                </div>
                                
                                <div class="w-[5%] shrink-0">
                                    <input type="text" id="cnt_${index}" value="${valCount}" readonly placeholder="건수" onclick="if(document.getElementById('status_${index}').value==='계약') openContractModal(${index}, '')" class="w-full px-1.5 py-1.5 border border-emerald-300 rounded bg-emerald-50 text-xs font-black text-emerald-700 text-center focus:outline-none cursor-pointer placeholder-emerald-300 transition hover:bg-emerald-100">
                                </div>
                                <div class="w-[9%] shrink-0">
                                    <input type="text" id="prm_${index}" value="${valPremium}" readonly placeholder="보험료" onclick="if(document.getElementById('status_${index}').value==='계약') openContractModal(${index}, '')" class="w-full px-2 py-1.5 border border-emerald-300 rounded bg-emerald-50 text-xs font-black text-emerald-700 text-right focus:outline-none cursor-pointer placeholder-emerald-300 transition hover:bg-emerald-100">
                                </div>

                                <div class="w-[14%] shrink-0">
                                    <input type="text" id="note_${index}" value="${valNote}" onchange="markModified(${index})" placeholder="비고 입력" class="w-full px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs">
                                </div>
                            </div>
                        </td>
                    </tr>
                `;

                mobileHtml += `
                    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden relative mb-4">
                        <input type="hidden" id="m_custName_${index}" value="${db.customerName}">
                        <div id="m_edit_area_${index}" class="p-4 transition-all bg-white">
                            <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-3">
                                <div class="flex items-center gap-2">
                                    <span class="bg-slate-800 text-white text-[10px] px-2 py-0.5 rounded font-bold">No.${index + 1}</span>
                                    <span class="font-black text-base text-slate-900">${db.customerName || '-'}</span>
                                </div>
                                <span class="text-rose-600 font-black text-xs bg-rose-50 px-2 py-1 rounded border border-rose-100">${db.timeLimit || '-'}</span>
                            </div>
                            <div class="text-xs text-slate-600 mb-4 bg-slate-50 p-2 rounded border border-slate-100 leading-snug">
                                <span class="font-bold text-slate-500 block mb-1">📝 메모</span>${db.memo || '-'}
                            </div>
                            <div class="space-y-2 bg-amber-50/50 p-3 rounded-lg border border-amber-100">
                                <div class="w-full flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold text-slate-700 whitespace-nowrap shrink-0">🎧 녹취</span>
                                    <div class="flex-grow w-full">
                                        ${db.audioUrl ? `<iframe src="${db.audioUrl.replace('uc?export=download&id=', 'file/d/')}/preview" class="w-full h-8 rounded border border-slate-300 bg-white shadow-sm"></iframe>` : `<div class="w-full h-8 flex items-center justify-center bg-slate-100 rounded border border-slate-200 text-[10px] text-slate-400 shadow-inner">녹취 없음</div>`}
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    ${generateTaSelect(`m_ta1_${index}`, '1차 TA(1일)', valTa1, index, 'm_')}
                                    ${generateTaSelect(`m_ta2_${index}`, '2차 TA(2일)', valTa2, index, 'm_')}
                                    ${generateTaSelect(`m_ta3_${index}`, '3차 TA(3일)', valTa3, index, 'm_')}
                                    ${generateTaSelect(`m_ta4_${index}`, '4차 이상 TA', valTa4, index, 'm_')}
                                </div>
                                <div class="flex gap-2 pt-1">
                                    <div class="w-[50%] flex gap-1">
                                        <input type="text" id="m_schedule_${index}" value="${valSchedule}" onchange="markModified(${index})" placeholder="일정입력" class="w-full px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs">
                                    </div>
                                    <div class="w-[50%]">
                                        <select id="m_status_${index}" onchange="handleStatusChange(${index}, 'm_')" class="w-full p-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs font-bold text-slate-700 bg-white">
                                            <option value="" ${valStatus===''?'selected':''}>- 현황 -</option>
                                            <option value="상담 중" ${valStatus==='상담 중'?'selected':''}>상담 중</option>
                                            <option value="상담완료" ${valStatus==='상담완료'?'selected':''}>상담완료</option>
                                            <option value="계약" ${valStatus==='계약'?'selected':''}>계약</option>
                                            <option value="장기배양(심사)" ${valStatus==='장기배양(심사)'?'selected':''}>장기배양(심사)</option>
                                            <option value="거절" ${valStatus==='거절'?'selected':''}>거절</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="flex gap-2 pt-1">
                                    <input type="text" id="m_cnt_${index}" value="${valCount}" readonly placeholder="건수" onclick="if(document.getElementById('m_status_${index}').value==='계약') openContractModal(${index}, 'm_')" class="w-[30%] px-2 py-2 border border-emerald-300 rounded bg-emerald-50 text-xs font-black text-emerald-700 focus:outline-none cursor-pointer text-center">
                                    <input type="text" id="m_prm_${index}" value="${valPremium}" readonly placeholder="보험료 입력 (터치)" onclick="if(document.getElementById('m_status_${index}').value==='계약') openContractModal(${index}, 'm_')" class="w-[70%] px-2 py-2 border border-emerald-300 rounded bg-emerald-50 text-xs font-black text-emerald-700 focus:outline-none cursor-pointer text-right">
                                </div>
                                <div class="pt-1">
                                    <input type="text" id="m_note_${index}" value="${valNote}" onchange="markModified(${index})" placeholder="비고(특이사항) 입력" class="w-full px-2 py-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="hidden xl:block bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden min-w-[1400px]">
                    <table class="w-full text-xs text-center border-collapse whitespace-nowrap">
                        <thead class="bg-slate-800 text-white">
                            <tr>
                                <th class="p-2 border-r border-slate-700 font-medium w-10">No.</th><th class="p-2 border-r border-slate-700 font-medium">배분날짜</th>
                                <th class="p-2 border-r border-slate-700 font-medium">전화번호</th><th class="p-2 border-r border-slate-700 font-medium">지역</th>
                                <th class="p-2 border-r border-slate-700 font-medium text-amber-300">고객명</th><th class="p-2 border-r border-slate-700 font-medium">시도</th>
                                <th class="p-2 border-r border-slate-700 font-medium">구군</th><th class="p-2 border-r border-slate-700 font-medium">읍면동</th>
                                <th class="p-2 border-r border-slate-700 font-medium">생년월일</th><th class="p-2 border-r border-slate-700 font-medium">성별</th>
                                <th class="p-2 border-r border-slate-700 font-medium whitespace-normal w-40">메모</th><th class="p-2 border-r border-slate-700 font-medium">담당설계사</th>
                                <th class="p-2 border-r border-slate-700 font-medium text-emerald-300">진행상태</th><th class="p-2 border-r border-slate-700 font-medium">배정일시</th>
                                <th class="p-2 font-medium text-rose-300">유효기간</th>
                            </tr>
                        </thead>
                        <tbody class="text-slate-700">${desktopHtml}</tbody>
                    </table>
                </div>
                <div class="block xl:hidden flex flex-col">${mobileHtml}</div>
            `;
        }

        function generateTaSelect(id, label, selectedValue, index, prefix) {
            const val = selectedValue || '';
            const colorClass = val === '' ? 'text-slate-500' : 'text-slate-800';
            return `
            <select id="${id}" onchange="markModified(${index})" class="w-full p-1.5 border border-slate-300 rounded focus:border-blue-500 focus:outline-none text-xs font-bold ${colorClass} bg-white">
                <option value="" ${val===''?'selected':''}>- ${label} -</option>
                <option value="부재" ${val==='부재'?'selected':''}>부재</option>
                <option value="다시" ${val==='다시'?'selected':''}>다시</option>
                <option value="거절" ${val==='거절'?'selected':''}>거절</option>
                <option value="예정" ${val==='예정'?'selected':''}>예정</option>
                <option value="본인설계사" ${val==='본인설계사'?'selected':''}>본인설계사</option>
            </select>
            `;
        }

        function handleStatusChange(index, prefix) {
            markModified(index);
            const statusVal = document.getElementById(`${prefix}status_${index}`).value;
            if (statusVal === '계약') { openContractModal(index, prefix); } 
            else { document.getElementById(`${prefix}cnt_${index}`).value = ""; document.getElementById(`${prefix}prm_${index}`).value = ""; }
        }

        function openContractModal(index, prefix) {
            currentModalIndex = index; currentModalPrefix = prefix;
            const container = document.getElementById('contractRowsContainer');
            container.innerHTML = ""; addContractRow(); addContractRow(); addContractRow();
            document.getElementById('contractModal').classList.remove('hidden');
        }

        function closeContractModal() { document.getElementById('contractModal').classList.add('hidden'); }

        function formatPremiumInput(input) {
            let val = input.value.replace(/[^0-9]/g, '');
            if(val === '') input.value = ''; else input.value = Number(val).toLocaleString();
        }

        function addContractRow() {
            const container = document.getElementById('contractRowsContainer');
            const rowDiv = document.createElement('div');
            rowDiv.className = "flex gap-2 mb-2 contract-item";
            rowDiv.innerHTML = `
                <select class="w-[45%] p-2 border border-slate-300 rounded font-bold text-sm text-slate-700 bg-white focus:outline-none focus:border-blue-500">
                    <option value="">- 상품 분류 -</option><option value="운전자">운전자</option><option value="장기(건강)">장기(건강)</option><option value="연금">연금</option><option value="종신(단기납)">종신(단기납포함)</option><option value="일반">일반</option>
                </select>
                <div class="w-[55%] relative">
                    <input type="text" placeholder="보험료 입력" oninput="formatPremiumInput(this)" class="contract-premium w-full p-2 border border-slate-300 rounded font-bold text-sm text-slate-700 text-right pr-6 focus:outline-none focus:border-blue-500">
                    <span class="absolute right-2 top-2.5 text-xs font-bold text-slate-400">원</span>
                </div>
            `;
            container.appendChild(rowDiv);
        }

        function removeContractRow() {
            const container = document.getElementById('contractRowsContainer');
            if (container.children.length > 1) container.removeChild(container.lastChild);
            else alert('최소 1개의 입력란은 필요합니다.');
        }

        function confirmContractModal() {
            const rows = document.querySelectorAll('.contract-item');
            let totalCount = 0; let totalPremium = 0;
            rows.forEach(row => {
                const category = row.querySelector('select').value;
                const premiumRaw = row.querySelector('.contract-premium').value.replace(/,/g, ''); 
                if (category && premiumRaw && !isNaN(premiumRaw)) { totalCount++; totalPremium += parseInt(premiumRaw, 10); }
            });
            if (totalCount === 0) { alert("입력된 상품 정보가 없습니다. 취소하시려면 '취소' 버튼을 눌러주세요."); return; }

            document.getElementById(`${currentModalPrefix}cnt_${currentModalIndex}`).value = totalCount + "건";
            document.getElementById(`${currentModalPrefix}prm_${currentModalIndex}`).value = totalPremium.toLocaleString() + "원";
            markModified(currentModalIndex);
            closeContractModal();
        }

        function markModified(index) {
            modifiedRows.add(index);
            const rowDivD = document.getElementById(`edit_area_${index}`);
            if(rowDivD) { rowDivD.classList.remove('bg-amber-50'); rowDivD.classList.add('bg-blue-50', 'ring-2', 'ring-inset', 'ring-blue-400'); }
            const rowDivM = document.getElementById(`m_edit_area_${index}`);
            if(rowDivM) { rowDivM.classList.remove('bg-white'); rowDivM.classList.add('bg-blue-50', 'ring-2', 'ring-inset', 'ring-blue-400'); }
        }

        async function saveAllChanges() {
            if (modifiedRows.size === 0) { alert("수정된 항목이 없습니다."); return; }

            const btn = document.getElementById('globalSaveBtn');
            const textSpan = document.getElementById('globalSaveText');
            btn.disabled = true; btn.classList.replace('bg-blue-600', 'bg-slate-500');

            const isMobileView = window.innerWidth < 1280;
            const pfx = isMobileView ? 'm_' : '';

            let successCount = 0; let failCount = 0;
            const total = modifiedRows.size; const indexes = Array.from(modifiedRows);

            for (let i = 0; i < indexes.length; i++) {
                const idx = indexes[i]; textSpan.innerText = `⏳ 저장 중... (${i+1}/${total})`;
                let rawCount = document.getElementById(`${pfx}cnt_${idx}`).value.replace(/[^0-9]/g, '');
                let rawPremium = document.getElementById(`${pfx}prm_${idx}`).value.replace(/[^0-9]/g, '');

                const payload = {
                    action: "updateHyunhwang",
                    agentName: currentAgent,
                    customerName: document.getElementById(`${pfx}custName_${idx}`).value,
                    ta1: document.getElementById(`${pfx}ta1_${idx}`).value,
                    ta2: document.getElementById(`${pfx}ta2_${idx}`).value,
                    ta3: document.getElementById(`${pfx}ta3_${idx}`).value,
                    ta4: document.getElementById(`${pfx}ta4_${idx}`).value,
                    schedule: document.getElementById(`${pfx}schedule_${idx}`).value,
                    status: document.getElementById(`${pfx}status_${idx}`).value,
                    contractCount: rawCount, contractPremium: rawPremium,
                    note: document.getElementById(`${pfx}note_${idx}`).value
                };

                try {
                    const response = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const result = await response.json();
                    if(result.success) successCount++;
                } catch (error) { failCount++; }
            }

            alert(`총 ${total}건 중 ${successCount}건이 성공적으로 저장되었습니다.` + (failCount > 0 ? `\n(실패: ${failCount}건)` : ""));
            btn.disabled = false; btn.classList.replace('bg-slate-500', 'bg-blue-600'); textSpan.innerText = "💾 전체 저장";
            loadData(); 
        }
    </script>
</body>
</html>
