<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itsrion 계약현황 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            font-family: 'Malgun Gothic', sans-serif; background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #F1F5F9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar relative">

    <header class="bg-slate-900 text-white p-4 xl:p-5 shadow-md flex justify-between items-center sticky top-0 z-40 w-full min-w-[800px]">
        <div>
            <h1 class="text-lg xl:text-xl font-black tracking-tight">나의 계약현황 대시보드</h1>
            <p class="text-[10px] xl:text-xs text-slate-400 mt-1">고객 정보 보호를 위해 화면 캡처 및 복사가 금지됩니다.</p>
        </div>
        <div class="flex items-center gap-2 xl:gap-3">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="agentNameDisplay" class="font-bold text-sm xl:text-lg text-emerald-400">로딩 중...</span>
        </div>
    </header>

    <main class="w-full p-4 xl:p-8 flex-grow pb-20 min-w-[800px] mx-auto max-w-7xl">
        
        <div id="loadingMessage" class="text-center py-20 text-slate-500 font-bold">
            실시간 대시보드 데이터를 불러오는 중입니다...
        </div>

        <!-- ⭐️ 대시보드 전용 영역 -->
        <div id="dashboardSection" class="hidden">
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-2xl xl:text-3xl font-black text-slate-800"><span id="dashName" class="text-blue-600"></span> 전문가님</h2>
                <div class="flex gap-4">
                    <div class="bg-blue-50 px-5 py-2.5 rounded-lg border border-blue-100 text-right shadow-sm">
                        <span class="text-[11px] text-blue-600 font-bold block mb-0.5">당월 종합체결률</span>
                        <span class="text-2xl font-black text-slate-800"><span id="dashRate">0</span>%</span>
                    </div>
                    <div class="bg-indigo-50 px-5 py-2.5 rounded-lg border border-indigo-100 text-right shadow-sm">
                        <span class="text-[11px] text-indigo-600 font-bold block mb-0.5">당월 소진 DB</span>
                        <span class="text-2xl font-black text-slate-800"><span id="dashConsumed">0</span>건</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 xl:grid-cols-5 gap-4 mb-8">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 text-center">
                    <span class="text-xs text-slate-500 font-bold tracking-tight block mb-1">당월 누적 보험료</span>
                    <div class="text-xl xl:text-2xl font-black text-slate-800"><span id="dashPremium">0</span><span class="text-sm font-bold text-slate-600 ml-0.5">원</span></div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 text-center">
                    <span class="text-xs text-slate-500 font-bold tracking-tight block mb-1">계약체결건수</span>
                    <div class="text-xl xl:text-2xl font-black text-emerald-600"><span id="dashContract">0</span><span class="text-sm font-bold text-emerald-600/70 ml-0.5">건</span></div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 text-center">
                    <span class="text-xs text-slate-500 font-bold tracking-tight block mb-1">평균상담소요기간</span>
                    <div class="text-xl xl:text-2xl font-black text-indigo-600"><span id="dashAvgDays">0</span><span class="text-sm font-bold text-indigo-600/70 ml-0.5">일</span></div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 text-center">
                    <span class="text-xs text-slate-500 font-bold tracking-tight block mb-1">당월배정DB수량</span>
                    <div class="text-xl xl:text-2xl font-black text-blue-700"><span id="dashAssigned">0</span><span class="text-sm font-bold text-blue-700/70 ml-0.5">건</span></div>
                </div>
                <div class="bg-emerald-50 p-5 rounded-xl shadow-sm border border-emerald-200 text-center xl:col-span-1 col-span-2">
                    <span class="text-xs text-emerald-700 font-bold tracking-tight block mb-1">진행중 상담 건수</span>
                    <div class="text-xl xl:text-2xl font-black text-emerald-800"><span id="dashOngoing">0</span><span class="text-sm font-bold text-emerald-700/70 ml-0.5">건</span></div>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <div class="bg-white p-5 xl:p-6 rounded-xl shadow-sm border border-slate-200 xl:col-span-1">
                    <h3 class="text-sm font-bold text-slate-700 mb-5 tracking-tight">📊 DB TA 상황별 건수 (3개월 누적)</h3>
                    <div class="h-64 relative w-full"><canvas id="barChart"></canvas></div>
                </div>
                <div class="bg-white p-5 xl:p-6 rounded-xl shadow-sm border border-slate-200 xl:col-span-2">
                    <h3 class="text-sm font-bold text-slate-700 mb-5 tracking-tight">📈 월별 DB소진수량 vs 체결건수</h3>
                    <div class="h-64 relative w-full"><canvas id="lineChart"></canvas></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault()); 
        document.addEventListener('copy', e => { e.preventDefault(); alert('개인정보 보호를 위해 복사는 금지되어 있습니다.'); }); 
        document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's' || e.key === 'c')) e.preventDefault(); });
        
        // ========================================================
        // ⭐️ 기존 웹앱 URL로 반드시 교체해 주세요!
        // ========================================================
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby8H2zf48p-i0w2HGy1psPnPWogNut3HplO_dv_QvWJTmx7n185N8msP1-ezfVNTkw0/exec"; 
        
        // 메인 페이지에서 로그인한 사용자 정보를 가져옵니다.
        const currentAgent = localStorage.getItem('rion_logged_user');
        
        let barChartInst = null;
        let lineChartInst = null;

        if (!currentAgent) {
            document.getElementById('loadingMessage').innerHTML = "<div class='text-center py-20 text-rose-500 font-bold text-lg'>권한이 없습니다.<br><span class='text-sm font-medium mt-2 block'>메인 홈페이지에서 로그인을 먼저 진행해주세요.</span></div>";
        } else {
            document.getElementById('agentNameDisplay').innerText = `${currentAgent} 접속중`;
            loadDashboardData();
        }

        async function loadDashboardData() {
            try {
                // 오직 대시보드 통계 데이터만 요청합니다. (DB 리스트는 불러오지 않음)
                const dashRes = await fetch(`${GAS_WEBAPP_URL}?agent=${encodeURIComponent(currentAgent)}&mode=dashboard`);
                const dashData = await dashRes.json();
                
                document.getElementById('loadingMessage').classList.add('hidden');
                renderDashboard(dashData);

            } catch (error) {
                document.getElementById('loadingMessage').innerHTML = `<div class="text-center py-20 text-rose-500 font-bold text-lg">데이터 서버 오류<br><span class="text-sm font-medium mt-2 block">${error.message}</span></div>`;
            }
        }

        function renderDashboard(data) {
            document.getElementById('dashboardSection').classList.remove('hidden');
            
            document.getElementById('dashName').innerText = data.agentName;
            document.getElementById('dashRate').innerText = data.conversionRate;
            document.getElementById('dashConsumed').innerText = data.consumedAll;
            
            document.getElementById('dashPremium').innerText = Number(data.totalPremiumThisMonth).toLocaleString();
            document.getElementById('dashContract').innerText = data.contractCount;
            document.getElementById('dashAvgDays').innerText = data.avgConsultDays;
            document.getElementById('dashAssigned').innerText = data.assignedThisMonth;
            document.getElementById('dashOngoing').innerText = data.ongoingCount;

            const barCtx = document.getElementById('barChart').getContext('2d');
            if(barChartInst) barChartInst.destroy();
            barChartInst = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['부재/다시', '거절(단박)', '예정', '상담중(장기)', '상담완료(계약)'],
                    datasets: [{ 
                        label: '건수', 
                        data: data.taStats, 
                        backgroundColor: ['#94a3b8', '#f43f5e', '#f59e0b', '#3b82f6', '#10b981'], 
                        borderRadius: 6 
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } }, 
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } 
                }
            });

            const lineCtx = document.getElementById('lineChart').getContext('2d');
            if(lineChartInst) lineChartInst.destroy();
            lineChartInst = new Chart(lineCtx, {
                type: 'line',
                data: {
                    labels: data.monthlyTrend.labels,
                    datasets: [
                        { 
                            label: '소진수량 (건)', 
                            data: data.monthlyTrend.consumed, 
                            borderColor: '#6366f1', 
                            backgroundColor: '#6366f1', 
                            tension: 0.3, borderWidth: 3 
                        },
                        { 
                            label: '체결건수 (건)', 
                            data: data.monthlyTrend.contracted, 
                            borderColor: '#10b981', 
                            backgroundColor: '#10b981', 
                            tension: 0.3, borderWidth: 3 
                        }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { position: 'bottom' } }, 
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } 
                }
            });
        }
    </script>
</body>
</html>
