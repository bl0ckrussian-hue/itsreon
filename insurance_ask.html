<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잇츠리온 - 전문가 자문센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #F8F9FA; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #F1F5F9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 h-screen overflow-hidden">

    <header class="bg-slate-900 text-white p-4 shadow-md flex-shrink-0 z-10 relative">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span id="expertIcon" class="text-2xl">🏛️</span>
                <h1 class="text-xl font-bold" id="headerTitle">전문가 자문센터</h1>
            </div>
            <button onclick="window.close()" class="text-sm font-bold bg-slate-700 hover:bg-slate-600 px-4 py-1.5 rounded transition">창 닫기</button>
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row max-w-7xl w-full mx-auto p-4 gap-6 overflow-hidden">
        
        <!-- [좌측 1/3] 자문위원 소개 -->
        <aside class="w-full md:w-1/3 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex-shrink-0">
                <h2 class="font-black text-slate-800 flex items-center gap-2"><span class="text-blue-600">■</span> 자문위원 소개</h2>
                <p class="text-[11px] text-slate-500 mt-1">현재 활동 중인 자문위원을 확인하세요.</p>
            </div>
            <div class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar" id="advisorListArea">
                <div class="text-center py-10 text-slate-400 text-sm">데이터를 불러오는 중입니다...</div>
            </div>
            <div id="adminControls" class="hidden p-4 border-t border-slate-100 bg-slate-50 flex-shrink-0">
                <button onclick="openAdvisorRegModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-2.5 rounded shadow transition">
                    + 본인 자문위원 소개 등록
                </button>
            </div>
        </aside>

        <!-- [우측 2/3] 자문 게시판 -->
        <section class="w-full md:w-2/3 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center flex-shrink-0">
                <div>
                    <h2 class="font-black text-slate-800 flex items-center gap-2"><span class="text-amber-500">■</span> 자문 문의 게시판</h2>
                    <p class="text-[11px] text-slate-500 mt-1">제목을 클릭하시면 전체 자문 내용을 확인하실 수 있습니다.</p>
                </div>
                <button onclick="openWriteModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-5 py-2 rounded shadow transition">
                    📝 자문 글쓰기
                </button>
            </div>
            <div class="flex-grow overflow-y-auto p-4 custom-scrollbar space-y-2" id="boardListArea">
                <div class="text-center py-10 text-slate-400 text-sm">데이터를 불러오는 중입니다...</div>
            </div>
        </section>
    </main>

    <!-- 모달: 1. 자문위원 프로필 보기 -->
    <div id="advisorViewModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl relative text-center">
            <button onclick="closeModal('advisorViewModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold">✕</button>
            <div id="detailPhotoContainer" class="w-24 h-32 mx-auto bg-slate-100 border border-slate-200 rounded flex items-center justify-center text-4xl mb-4 overflow-hidden">👤</div>
            <h3 class="text-xl font-black text-slate-900" id="detailName">김자문</h3>
            <span class="inline-block bg-blue-50 text-blue-700 text-[10px] font-bold px-3 py-1 rounded-full mt-1 mb-4" id="detailBadge">자문단</span>
            <div class="text-left bg-slate-50 border border-slate-100 rounded-lg p-4 text-xs text-slate-700 space-y-3">
                <div><p class="font-bold text-slate-900 mb-0.5">■ 주요 이력</p><p id="detailHistory" class="leading-relaxed whitespace-pre-line"></p></div>
                <div><p class="font-bold text-slate-900 mb-0.5">■ 전문 자문 분야</p><p id="detailSpecialty" class="leading-relaxed whitespace-pre-line"></p></div>
            </div>
            <div id="detailDeleteBtnContainer" class="hidden mt-4">
                <button onclick="deleteAdvisorProfile()" class="w-full bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold py-2 rounded hover:bg-rose-100 transition">
                    🗑️ 이 프로필 및 사진 삭제
                </button>
            </div>
        </div>
    </div>

    <!-- 모달: 2. 자문위원 소개 등록 -->
    <div id="advisorRegModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeModal('advisorRegModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold">✕</button>
            <h3 class="text-lg font-black text-slate-900 mb-4 border-b pb-2">자문위원 프로필 등록</h3>
            <form id="advRegForm" onsubmit="submitAdvisorReg(event)" class="space-y-3 text-xs">
                <div><label class="block font-bold text-slate-700 mb-1">성명</label><input type="text" id="regAdvName" placeholder="예: 김자문" required class="w-full px-3 py-2 border rounded focus:border-slate-500 outline-none"></div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">반명함 사진 첨부 (선택)</label>
                    <div class="flex items-center gap-2 mb-2">
                         <input type="file" id="advPhotoFile" class="hidden" accept="image/*" onchange="handleAdvPhotoSelect(event)">
                         <button type="button" onclick="document.getElementById('advPhotoFile').click()" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 px-3 py-1.5 rounded text-xs font-semibold shadow-sm transition">+ 사진 선택</button>
                    </div>
                    <div id="advPhotoStatus" class="hidden flex items-center justify-between border border-blue-200 bg-blue-50 px-3 py-2 rounded">
                         <div class="flex items-center gap-2 overflow-hidden"><span class="text-blue-500 font-bold">🖼️</span><span id="advPhotoFileName" class="text-xs font-medium text-slate-700 truncate w-48"></span></div>
                         <button type="button" onclick="cancelAdvPhoto()" class="text-slate-400 hover:text-red-500 font-bold ml-2">✕</button>
                    </div>
                </div>
                <input type="hidden" id="advPhotoBase64"><input type="hidden" id="advPhotoName"><input type="hidden" id="advPhotoMime">
                <div><label class="block font-bold text-slate-700 mb-1">주요 이력</label><textarea id="regAdvHistory" rows="2" placeholder="주요 경력을 적어주세요." required class="w-full px-3 py-2 border rounded focus:border-slate-500 outline-none resize-none"></textarea></div>
                <div><label class="block font-bold text-slate-700 mb-1">전문 분야</label><textarea id="regAdvSpecialty" rows="2" placeholder="자문 가능한 전문 분야를 적어주세요." required class="w-full px-3 py-2 border rounded focus:border-slate-500 outline-none resize-none"></textarea></div>
                <button type="submit" id="submitAdvBtn" class="mt-2 w-full bg-slate-900 text-white font-bold py-2.5 rounded shadow">저장 및 반영</button>
            </form>
        </div>
    </div>

    <!-- 모달: 3. 자문 글쓰기 게시판 -->
    <div id="writeModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="closeWriteModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
            <h3 class="text-lg font-black text-slate-900 mb-4" id="modalTitle">자문 글쓰기</h3>
            
            <form id="askFormContainer" class="space-y-3 text-xs block">
                <div><label class="block font-bold text-slate-700 mb-1">제목</label><input type="text" id="postTitle" placeholder="제목을 입력하세요" required class="w-full px-3 py-2 border rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block font-bold text-slate-700 mb-1">자문 내용</label><textarea id="postContent" rows="5" placeholder="자문 내용을 상세히 입력하세요." required class="w-full px-3 py-2 border rounded focus:border-blue-500 outline-none resize-none"></textarea></div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">자료 첨부 (선택)</label>
                    <div class="flex items-center gap-2 mb-2">
                         <input type="file" id="postFile" class="hidden" onchange="handleFileSelect(event)">
                         <button type="button" onclick="document.getElementById('postFile').click()" class="bg-slate-100 border border-slate-300 px-3 py-1.5 rounded text-xs font-semibold">+ 파일 선택</button>
                    </div>
                    <div id="uploadStatus" class="hidden flex items-center justify-between border border-blue-200 bg-blue-50 px-3 py-2 rounded">
                         <div class="flex items-center gap-2 overflow-hidden"><span class="text-blue-500 font-bold">📎</span><span id="uploadedFileName" class="text-xs text-slate-700 truncate w-48"></span></div>
                         <button type="button" onclick="cancelUpload()" class="text-slate-400 hover:text-red-500 font-bold ml-2">✕</button>
                    </div>
                </div>
                <input type="hidden" id="postFileBase64"><input type="hidden" id="postFileName"><input type="hidden" id="postFileMime">

                <!-- ⭐️ 비밀글 설정 부분 부활 -->
                <div class="bg-slate-50 p-3 rounded border border-slate-200 mt-2 space-y-2">
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="isSecret" class="w-4 h-4 text-blue-600" onchange="togglePasswordField()">
                        <label for="isSecret" class="text-slate-700 font-bold cursor-pointer text-[11px]">🔒 이 글을 비밀글로 설정합니다. (작성자/관리자만 열람)</label>
                    </div>
                    <div id="passwordFieldContainer" class="hidden pl-6">
                        <input type="password" id="postPassword" placeholder="열람용 비밀번호 4자리 숫자 입력" class="w-full max-w-[200px] px-3 py-2 border rounded focus:border-blue-500 outline-none text-xs">
                        <p class="text-[10px] text-slate-400 mt-1">* 나중에 이 글을 열람하거나 삭제할 때 필요합니다.</p>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="button" id="submitBtn" onclick="startRealUpload()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700">게시글 등록하기</button>
                </div>
            </form>

            <div id="uploadProgressContainer" class="hidden py-4">
                <p class="text-sm font-bold text-slate-700 mb-3" id="progressStatusText">게시글 및 파일 동기화 중...</p>
                <div class="w-full bg-slate-200 rounded-full h-3.5 mb-2 overflow-hidden"><div id="progressBar" class="bg-blue-600 h-3.5 rounded-full" style="width: 0%"></div></div>
                <p class="text-xs text-right font-bold text-blue-600" id="progressPercentText">0%</p>
            </div>
        </div>
    </div>

    <script>
        // ⭐️ 앱스 스크립트 웹앱 주소를 넣어주세요.
        const ASK_DB_URL = "https://script.google.com/macros/s/AKfycbyFF6KWySblVtrlSuGP5aRnnryewYIRocgjDxDQyevg6lj4MuMyzF8f5dv1XcM4Il31fA/exec";

        const loggedUser = localStorage.getItem('rion_logged_user');
        const loggedRole = localStorage.getItem('rion_logged_role') || ''; 
        const urlParams = new URLSearchParams(window.location.search);
        const expertType = urlParams.get('type') || '변호사'; 

        let boardData = []; 
        let advisorData = [];
        let currentDetailRowIdx = null;
        let currentDetailFileId = null;

        document.getElementById('headerTitle').innerText = `${expertType} 자문센터`;
        document.getElementById('modalTitle').innerText = `[${expertType}] 자문 신청하기`;
        const iconMap = { '변호사': '⚖️', '세무사': '📑', '공인회계사': '📊', '변리사': '💡', '손해사정사': '🛡️', '공인노무사': '👥' };
        document.getElementById('expertIcon').innerText = iconMap[expertType] || '🏛️';

        window.onload = function() {
            if (!loggedUser) { alert("회원만 접근 가능합니다. 메인페이지에서 로그인 해주세요."); window.close(); }
            const requiredAdminRole = `자문관리자(${expertType})`;
            if (loggedRole.includes(requiredAdminRole) || loggedRole === '최고관리자' || loggedUser === '김성철') {
                document.getElementById('adminControls').classList.remove('hidden');
            }
            loadAllData();
        };

        // 비밀번호 필드 토글
        function togglePasswordField() {
            const isChecked = document.getElementById('isSecret').checked;
            const container = document.getElementById('passwordFieldContainer');
            if (isChecked) {
                container.classList.remove('hidden');
                document.getElementById('postPassword').required = true;
            } else {
                container.classList.add('hidden');
                document.getElementById('postPassword').required = false;
                document.getElementById('postPassword').value = '';
            }
        }

        async function loadAllData() {
            try {
                const res = await fetch(ASK_DB_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "getAskData", expertType: expertType })
                });
                const result = await res.json();
                if(result.success) {
                    boardData = result.boardData || [];
                    advisorData = result.advisorData || [];
                    renderBoard(); renderAdvisors();
                }
            } catch(e) { console.error("오류 발생:", e); }
        }

        function renderAdvisors() {
            const listArea = document.getElementById('advisorListArea');
            listArea.innerHTML = '';
            if (advisorData.length === 0) { listArea.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">등록된 자문위원이 없습니다.</div>'; return; }

            advisorData.forEach(adv => {
                let photoHtml = `<div class="w-[60px] h-[80px] bg-slate-100 rounded flex flex-shrink-0 items-center justify-center text-2xl border border-slate-200">👤</div>`;
                if (adv.photoData && adv.photoData.id) { photoHtml = `<img src="https://drive.google.com/thumbnail?id=${adv.photoData.id}&sz=w200" class="w-[60px] h-[80px] object-cover rounded border border-slate-200 flex-shrink-0">`; }
                
                const div = document.createElement('div');
                div.className = 'border border-slate-200 rounded-lg p-3 cursor-pointer hover:border-blue-400 hover:shadow-md transition bg-white';
                div.onclick = () => openAdvisorDetail(adv);
                div.innerHTML = `<div class="flex items-center gap-4">${photoHtml}<div class="overflow-hidden flex-1"><h3 class="font-bold text-slate-900">${adv.name} <span class="text-[10px] text-blue-600 font-semibold ml-1 bg-blue-50 px-1.5 py-0.5 rounded">${expertType}</span></h3><p class="text-[11px] text-slate-500 mt-1 line-clamp-2">${adv.history}</p></div></div>`;
                listArea.appendChild(div);
            });
        }

        // ⭐️ 게시판 렌더링 (공개 리스트 + 클릭 시 비밀번호 검사 적용)
        function renderBoard() {
            const listArea = document.getElementById('boardListArea');
            listArea.innerHTML = '';
            if (boardData.length === 0) { listArea.innerHTML = '<div class="text-center py-10 text-slate-400 text-sm">등록된 게시물이 없습니다.</div>'; return; }

            boardData.sort((a,b) => b.rowIdx - a.rowIdx).forEach((item) => {
                const statusClass = item.status === '답변완료' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700';
                const isSecret = item.isSecret === true || String(item.isSecret).toLowerCase() === 'true';
                const secretIcon = isSecret ? '🔒 ' : '';
                
                let fileBtnHTML = item.fileData && item.fileData.url 
                    ? `<button onclick="window.open('${item.fileData.url}', '_blank')" class="text-xs font-bold text-blue-600 hover:underline">💾 파일 보기/다운로드</button>` 
                    : `<span class="text-xs text-slate-400">첨부파일 없음</span>`;

                const adminReply = item.adminReply ? item.adminReply : '<span class="text-slate-400 italic">아직 작성된 답변이 없습니다.</span>';

                // 모두 제목은 노출됨
                const contentHTML = `
                    <div class="flex justify-between items-center p-3.5 cursor-pointer hover:bg-slate-50 transition" onclick="togglePost(${item.rowIdx}, ${isSecret}, '${item.author}', '${item.password}')">
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-bold ${statusClass} px-2 py-0.5 rounded">${item.status || '대기중'}</span>
                            <h4 class="font-bold text-sm text-slate-800">${secretIcon}${item.title}</h4>
                        </div>
                        <div class="flex items-center gap-4 text-xs text-slate-500 font-medium">
                            <span>${item.author}</span>
                            <span>${item.date}</span>
                            <span class="text-[10px]">▼</span>
                        </div>
                    </div>
                    <div id="post-${item.rowIdx}" class="hidden border-t border-slate-100 bg-slate-50/50 p-4 animate-fade-in">
                        <div class="text-sm text-slate-700 leading-relaxed whitespace-pre-line mb-4">${item.content}</div>
                        <div class="flex justify-between items-center bg-white p-3 border rounded border-slate-200 mb-4">
                            ${fileBtnHTML}
                            <button onclick="deletePost(${item.rowIdx}, '${item.fileData ? item.fileData.id : ''}')" class="text-xs font-bold text-rose-500 border border-rose-200 px-3 py-1 rounded bg-rose-50">🗑️ 삭제</button>
                        </div>
                        <div class="bg-white border border-blue-100 rounded p-3 text-sm">
                            <span class="font-bold text-blue-700 block mb-1">↳ 담당 자문위원 답변</span>
                            <p class="text-slate-600 whitespace-pre-line">${adminReply}</p>
                        </div>
                    </div>
                `;
                const div = document.createElement('div');
                div.className = 'border border-slate-200 rounded-lg overflow-hidden bg-white hover:border-slate-300';
                div.innerHTML = contentHTML;
                listArea.appendChild(div);
            });
        }

        // ⭐️ 클릭 시 비밀번호 검사 로직
        function togglePost(rowIdx, isSecret, authorName, truePassword) {
            const el = document.getElementById(`post-${rowIdx}`);
            if (!el.classList.contains('hidden')) {
                el.classList.add('hidden');
                return;
            }

            const isAdmin = loggedRole.includes(`자문관리자(${expertType})`) || loggedRole === '최고관리자' || loggedUser === '김성철';
            const isOwner = loggedUser === authorName;

            // 공개글이거나 관리자/본인이면 무사 통과
            if (!isSecret || isOwner || isAdmin) {
                el.classList.remove('hidden');
            } else {
                // 제 3자일 경우 비밀번호 요구
                const inputPw = prompt("🔒 이 글은 비밀글입니다. 작성 시 입력한 비밀번호를 입력해주세요.");
                if (inputPw === null) return; // 취소 누름
                if (inputPw === String(truePassword)) {
                    el.classList.remove('hidden');
                } else {
                    alert("비밀번호가 일치하지 않습니다.");
                }
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function openAdvisorDetail(adv) {
            document.getElementById('detailName').innerText = adv.name;
            document.getElementById('detailHistory').innerText = adv.history;
            document.getElementById('detailSpecialty').innerText = adv.specialty;
            let photoHtml = `👤`;
            if (adv.photoData && adv.photoData.id) {
                photoHtml = `<img src="https://drive.google.com/thumbnail?id=${adv.photoData.id}&sz=w400" class="w-full h-full object-cover">`;
            }
            document.getElementById('detailPhotoContainer').innerHTML = photoHtml;

            const canDelete = (loggedUser === adv.authorId || loggedRole.includes(`자문관리자(${expertType})`) || loggedRole === '최고관리자' || loggedUser === '김성철');
            if (canDelete) {
                document.getElementById('detailDeleteBtnContainer').classList.remove('hidden');
                currentDetailRowIdx = adv.rowIdx;
                currentDetailFileId = adv.photoData ? adv.photoData.id : null;
            } else { document.getElementById('detailDeleteBtnContainer').classList.add('hidden'); }
            openModal('advisorViewModal');
        }

        function handleAdvPhotoSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('advPhotoStatus').classList.remove('hidden');
                document.getElementById('advPhotoFileName').innerText = file.name;
                document.getElementById('advPhotoName').value = file.name;
                document.getElementById('advPhotoMime').value = file.type;
                document.getElementById('advPhotoBase64').value = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        function cancelAdvPhoto() {
            document.getElementById('advPhotoFile').value = '';
            document.getElementById('advPhotoStatus').classList.add('hidden');
            document.getElementById('advPhotoBase64').value = '';
            document.getElementById('advPhotoName').value = '';
        }

        async function submitAdvisorReg(e) {
            e.preventDefault();
            const btn = document.getElementById('submitAdvBtn');
            btn.innerText = "저장 중..."; btn.disabled = true;

            const base64Data = document.getElementById('advPhotoBase64').value;
            const hasFile = base64Data && base64Data.length > 0;
            const payload = {
                action: "registerAdvisor", expertType: expertType,
                name: document.getElementById('regAdvName').value,
                history: document.getElementById('regAdvHistory').value,
                specialty: document.getElementById('regAdvSpecialty').value, authorId: loggedUser,
                fileName: hasFile ? document.getElementById('advPhotoName').value : "",
                mimeType: hasFile ? document.getElementById('advPhotoMime').value : "", fileData: hasFile ? base64Data : ""
            };

            try {
                const res = await fetch(ASK_DB_URL, { method: "POST", body: JSON.stringify(payload) });
                const result = await res.json();
                if(result.success) {
                    alert("프로필이 등록되었습니다."); closeModal('advisorRegModal');
                    document.getElementById('advRegForm').reset(); cancelAdvPhoto(); loadAllData();
                } else { alert("등록 실패"); }
            } catch(e) { alert("오류 발생"); }
            btn.innerText = "저장 및 반영"; btn.disabled = false;
        }

        async function deleteAdvisorProfile() {
            if(!confirm("자문위원 프로필과 사진을 영구 삭제하시겠습니까?")) return;
            try {
                const res = await fetch(ASK_DB_URL, { method: "POST", body: JSON.stringify({ action: "deleteAdvisor", expertType: expertType, rowIdx: currentDetailRowIdx, fileId: currentDetailFileId }) });
                const result = await res.json();
                if(result.success) { alert("삭제 완료되었습니다."); closeModal('advisorViewModal'); loadAllData(); }
            } catch(e) { alert("삭제 실패"); }
        }

        function openWriteModal() {
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('isSecret').checked = false;
            document.getElementById('postPassword').value = '';
            togglePasswordField();
            cancelUpload(); openModal('writeModal');
        }
        function closeWriteModal() { closeModal('writeModal'); document.getElementById('askFormContainer').classList.remove('hidden'); document.getElementById('uploadProgressContainer').classList.add('hidden'); }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('uploadStatus').classList.remove('hidden');
                document.getElementById('uploadedFileName').innerText = file.name;
                document.getElementById('postFileName').value = file.name;
                document.getElementById('postFileMime').value = file.type;
                document.getElementById('postFileBase64').value = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }
        function cancelUpload() { document.getElementById('postFile').value = ''; document.getElementById('uploadStatus').classList.add('hidden'); document.getElementById('postFileBase64').value = ''; document.getElementById('postFileName').value = ''; }

        async function startRealUpload() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const isSecret = document.getElementById('isSecret').checked;
            const password = document.getElementById('postPassword').value;
            if (!title || !content) { alert("제목과 내용을 입력해주세요."); return; }
            if (isSecret && !password) { alert("비밀번호를 4자리 숫자로 입력해주세요."); return; }

            document.getElementById('askFormContainer').classList.add('hidden');
            document.getElementById('uploadProgressContainer').classList.remove('hidden');
            
            let progress = 0; const bar = document.getElementById('progressBar'); const pct = document.getElementById('progressPercentText');
            const interval = setInterval(() => { if (progress < 90) { progress += 10; bar.style.width = progress + '%'; pct.innerText = progress + '%'; } }, 300);

            const b64 = document.getElementById('postFileBase64').value;
            const hasFile = b64 && b64.length > 0;

            const payload = {
                action: "writeAskPost", expertType: expertType, title: title, content: content, author: loggedUser,
                isSecret: isSecret, password: password, // 비밀번호 전송
                fileName: hasFile ? document.getElementById('postFileName').value : "",
                mimeType: hasFile ? document.getElementById('postFileMime').value : "", fileData: hasFile ? b64 : ""
            };

            try {
                const res = await fetch(ASK_DB_URL, { method: "POST", body: JSON.stringify(payload) });
                const result = await res.json();
                clearInterval(interval);
                if (result.success) {
                    bar.style.width = '100%'; pct.innerText = '100%';
                    setTimeout(() => { alert("게시글이 등록되었습니다."); closeWriteModal(); loadAllData(); }, 500);
                } else { alert("오류"); closeWriteModal(); }
            } catch(e) { clearInterval(interval); alert("통신 오류 발생"); closeWriteModal(); }
        }

        async function deletePost(rowIdx, fileId) {
            // 삭제 권한 재검증
            const isAdmin = loggedRole.includes(`자문관리자(${expertType})`) || loggedRole === '최고관리자' || loggedUser === '김성철';
            
            if (!isAdmin) {
                const pw = prompt("글 작성시 입력했던 비밀번호를 입력해주세요.");
                if (pw === null) return;
                
                // 프론트엔드에서 데이터 배열에서 비밀번호 일치 확인
                const post = boardData.find(item => item.rowIdx === rowIdx);
                if (post && post.password !== pw) {
                    alert("비밀번호가 일치하지 않아 삭제할 수 없습니다.");
                    return;
                }
            } else {
                if (!confirm("관리자 권한으로 이 글과 파일을 영구 삭제하시겠습니까?")) return;
            }

            try {
                const res = await fetch(ASK_DB_URL, {
                    method: "POST", body: JSON.stringify({ action: "deleteAskPost", expertType: expertType, rowIdx: rowIdx, fileId: fileId })
                });
                const result = await res.json();
                if (result.success) { alert("삭제 완료"); loadAllData(); }
            } catch(e) { alert("삭제 실패"); }
        }
    </script>
</body>
</html>
