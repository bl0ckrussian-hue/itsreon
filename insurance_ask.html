<!DOCTYPE html>
<html lang="ko">
<!-- ... (head 및 상단 헤더, 좌측 소개 영역은 이전 코드와 완벽히 동일하므로 생략) ... -->

        <!-- ================= [우측 2/3] 자문 게시판 영역 ================= -->
        <section class="w-full md:w-2/3 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center flex-shrink-0">
                <div>
                    <h2 class="font-black text-slate-800 flex items-center gap-2">
                        <span class="text-amber-500">■</span> 자문 문의 게시판
                    </h2>
                    <p class="text-[11px] text-slate-500 mt-1">제목을 클릭하시면 전체 자문 내용을 확인하실 수 있습니다.</p>
                </div>
                <button onclick="openWriteModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-5 py-2 rounded shadow transition">
                    📝 자문 글쓰기
                </button>
            </div>
            
            <!-- 게시판 리스트 영역 -->
            <div class="flex-grow overflow-y-auto p-4 custom-scrollbar space-y-2" id="boardListArea">
                <!-- 💡 JS를 통해 렌더링될 때 아래와 같은 구조로 생성됩니다. 
                     삭제 버튼 추가를 위한 예시 UI 입니다. -->
                <div class="border border-slate-200 rounded-lg overflow-hidden bg-white hover:border-slate-300 transition">
                    <div class="flex justify-between items-center p-3.5 cursor-pointer hover:bg-slate-50" onclick="togglePost('post-1')">
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-0.5 rounded">답변대기</span>
                            <h4 class="font-bold text-sm text-slate-800">증여세 관련 서류 검토 부탁드립니다.</h4>
                        </div>
                        <div class="flex items-center gap-4 text-xs text-slate-500 font-medium">
                            <span>김설계</span>
                            <span>2026.09.28</span>
                            <span class="text-[10px]">▼</span>
                        </div>
                    </div>
                    <div id="post-1" class="hidden border-t border-slate-100 bg-slate-50/50 p-4">
                        <div class="text-sm text-slate-700 leading-relaxed whitespace-pre-line mb-4">
                            첨부한 PDF 서류 검토를 부탁드립니다.
                        </div>
                        
                        <!-- 파일 다운로드 및 삭제 버튼 영역 -->
                        <div class="flex justify-between items-center bg-white p-3 border rounded">
                            <button onclick="window.open('여기에_구글드라이브_다운로드링크', '_blank')" class="text-xs font-bold text-blue-600 hover:underline flex items-center gap-1">
                                💾 첨부파일 다운로드 (증여세_검토요청.pdf)
                            </button>
                            <!-- 본인 또는 관리자만 보이는 삭제 버튼 -->
                            <button onclick="deletePost(2, '구글드라이브_파일ID')" class="text-xs font-bold text-rose-500 hover:text-rose-700 border border-rose-200 px-3 py-1 rounded bg-rose-50 transition">
                                🗑️ 게시글 및 파일 삭제
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 3. 자문 글쓰기 게시판 모달 (수정됨: 파일 직접 첨부) -->
    <div id="writeModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="closeModal('writeModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold">✕</button>
            <h3 class="text-lg font-black text-slate-900 mb-4" id="modalTitle">자문 글쓰기</h3>
            
            <!-- 파일 업로드를 위해 폼 추가 -->
            <form id="askForm" onsubmit="submitPost(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">제목</label>
                    <input type="text" id="postTitle" placeholder="제목을 입력하세요" required class="w-full px-3 py-2 border rounded focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">자문 내용</label>
                    <textarea id="postContent" rows="5" placeholder="자문 내용을 상세히 입력하세요." required class="w-full px-3 py-2 border rounded focus:border-blue-500 outline-none resize-none"></textarea>
                </div>
                <!-- 💡 파일 직접 첨부로 변경 -->
                <div>
                    <label class="block font-bold text-slate-700 mb-1">자료 첨부 (직접 업로드)</label>
                    <input type="file" id="postFile" class="w-full text-xs file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-slate-200 p-1">
                    <p class="text-[10px] text-slate-400 mt-1">* 10MB 이하의 파일(PDF, 이미지, 엑셀 등)만 업로드 가능합니다.</p>
                </div>
                <div class="flex items-center space-x-2 bg-slate-50 p-2.5 rounded border border-slate-200 mt-2">
                    <input type="checkbox" id="isSecret" class="w-4 h-4 text-blue-600">
                    <label for="isSecret" class="text-slate-700 font-bold cursor-pointer text-[11px]">🔒 관리자와 작성자 본인만 볼 수 있는 비밀글로 작성합니다.</label>
                </div>
                <div class="pt-2">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition">
                        게시글 등록 및 파일 업로드
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ... (다른 스크립트 및 UI 로직은 기존 유지) ... -->

    <script>
        const ASK_DB_URL = "https://script.google.com/macros/s/AKfycbyFrnvV5LKlMEpUGmegcgDFqT7iFtoXo2tQwWWUosEtfp8R7eo6mXzulQKta4QRF-8N8Q/exec"; // ★ 웹앱 URL

        // ==========================================
        // 1. 게시물 및 파일 업로드 로직
        // ==========================================
        async function submitPost(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('postFile');
            const file = fileInput.files[0];

            // 용량 제한 검사 (10MB)
            if (file && file.size > 10 * 1024 * 1024) {
                alert("파일 크기는 10MB를 초과할 수 없습니다.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = "파일 업로드 및 등록 중... (잠시만 기다려주세요)";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            try {
                let base64Data = "";
                let fileName = "";
                let mimeType = "";

                // 파일이 존재하면 Base64로 변환
                if (file) {
                    fileName = file.name;
                    mimeType = file.type;
                    base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = error => reject(error);
                        reader.readAsDataURL(file);
                    });
                }

                // 앱스 스크립트로 전송할 데이터 세팅
                const payload = {
                    action: "writeAskPost",
                    expertType: expertType, // 변호사, 세무사 등
                    title: document.getElementById('postTitle').value,
                    content: document.getElementById('postContent').value,
                    author: loggedUser, 
                    isSecret: document.getElementById('isSecret').checked,
                    fileName: fileName,
                    mimeType: mimeType,
                    fileData: base64Data // 인코딩된 파일 데이터
                };

                const res = await fetch(ASK_DB_URL, {
                    method: "POST",
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();

                if (result.success) {
                    alert(`[${expertType}] 게시판에 글과 파일이 성공적으로 등록되었습니다.`);
                    closeModal('writeModal');
                    document.getElementById('askForm').reset();
                    // 위치: 게시판 목록 새로고침 함수 호출 (loadBoardList() 등)
                } else {
                    alert("업로드 중 오류가 발생했습니다: " + result.message);
                }

            } catch (error) {
                alert("통신 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
            } finally {
                btn.innerText = "게시글 등록 및 파일 업로드";
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        // ==========================================
        // 2. 게시글 및 드라이브 파일 동시 삭제 로직
        // ==========================================
        async function deletePost(rowIdx, fileId) {
            // 본인확인 또는 권한 확인은 GAS에서 추가 검증 가능하지만, 
            // 프론트엔드에서도 로그인된 계정과 작성자가 같은지 체크 후 버튼을 띄웁니다.
            if (!confirm("정말 이 게시글을 삭제하시겠습니까?\n첨부된 자료도 구글 드라이브에서 영구 삭제됩니다.")) return;

            try {
                const payload = {
                    action: "deleteAskPost",
                    expertType: expertType,
                    rowIdx: rowIdx,
                    fileId: fileId // 이 ID를 넘기면 스크립트가 파일을 찾아 삭제합니다.
                };

                const res = await fetch(ASK_DB_URL, {
                    method: "POST",
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();
                
                if (result.success) {
                    alert("게시글과 첨부파일이 완전히 삭제되었습니다.");
                    // 위치: 게시판 목록 새로고침 함수 호출
                } else {
                    alert("삭제 실패: " + result.message);
                }
            } catch (error) {
                alert("삭제 중 오류가 발생했습니다.");
            }
        }
    </script>
</body>
</html>
