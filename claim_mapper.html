<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    (function checkMapperAccess() {
      const getVal = (k) => (localStorage.getItem(k) || sessionStorage.getItem(k) || '').trim();
      let role = getVal('rion_logged_role') || getVal('userRole') || getVal('role');
      let user = getVal('rion_logged_user') || getVal('rion_logged_id') || getVal('userId');
      const MAIN_ADMIN_ROLES = ['메인관리자', '최고관리자', '대표관리자', 'master', 'superadmin', 'admin', '관리자'];
      const MAIN_ADMIN_ONLY_USERS = []; // 필요 시 특정 성명/ID 지정

      const r = role.toLowerCase();
      const allowed = r && !r.includes('부관리') && !r.includes('sub')
        && (MAIN_ADMIN_ONLY_USERS.length === 0 || MAIN_ADMIN_ONLY_USERS.includes(user))
        && MAIN_ADMIN_ROLES.includes(r);

      if (!allowed) {
        alert('메인 관리자만 접근할 수 있는 페이지입니다.');
        window.close();
        location.replace('./index.html');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    document.write('<script src="./claim_coords.js?v=' + Date.now() + '"><\/script>');

  <style>

    .toolbar {
      background: #1e293b;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid #334155;
    }

    .btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #475569; }
    .btn-green { background: #10b981; border-color: #059669; }
    .btn-green:hover { background: #059669; }
    .btn-red { background: #e11d48; border-color: #be123c; }

    .workspace { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 265px;
      background: #0f172a;
      padding: 14px;
      overflow-y: auto;

      font-weight: 700;

    }
    .palette-btn.active { background: #2563eb; border-color: #60a5fa; color: #fff; }

    .canvas-area {
      flex: 1;
      overflow: auto;

      align-items: flex-start;

    }

    .pdf-stage {

      background: #fff;

    }

      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: grab;

</head>
<body>

      { type: 'check', key: 'acc_traffic', label: '✔ [사고유형] 교통사고', condStr: "(d) => d.accidentType === '교통사고'" },

      { type: 'check', key: 'auto_trans', label: '✔ [계좌] 자동이체계좌 요청', condStr: '(d) => d.useAutoTransfer' },

      { type: 'sig', role: 'insured', label: '✍️ [서명] 피보험자(본인)' },
      { type: 'sig', role: 'beneficiary', label: '✍️ [서명] 수익자(청구권자)' },
      { type: 'sig', role: 'holder', label: '✍️ [서명] 보험계약자' },
      { type: 'sig', role: 'guardian', label: '✍️ [서명] 법정대리인(14세미만)' }
    ];

    let pdfDoc = null;
    let currentInsurer = '';
    let pageNum = 1;
    let scale = 1.3;
    let selectedItem = PALETTE_ITEMS[0];
    let pageWidthPt = 595.28;
    let pageHeightPt = 841.89;

    function initMapper() {
      const sel = document.getElementById('insurer-select');
      const withPdf = INSURER_DB.nonLife.filter(i => i.pdfFile);
      sel.innerHTML = withPdf.map(i => `<option value="${i.id}">${i.name}</option>`).join('');
      currentInsurer = sel.value;

      document.getElementById('palette').innerHTML =
        `<div style="font-size:11.5px; color:#94a3b8; line-height:1.4; margin-bottom:6px;">
          1) 왼쪽 항목 선택 후 양식 빈칸을 클릭하면 핀이 꽂힙니다.<br>
          2) 잘못 꽂은 핀은 <b>마우스 우클릭</b>하면 삭제됩니다.<br>
          3) 완료 후 상단 초록색 복사 버튼을 눌러 <b>claim_coords.js</b>에 붙여넣으세요.
        </div>` +
        PALETTE_ITEMS.map((it, idx) => `
          <button class="palette-btn ${idx === 0 ? 'active' : ''}" onclick="selectItem(${idx}, this)">${it.label}</button>
        `).join('');

      loadPdf();
    }

    function selectItem(idx, btn) {
      selectedItem = PALETTE_ITEMS[idx];
      document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    async function loadPdf() {
      currentInsurer = document.getElementById('insurer-select').value;
      const ins = INSURER_DB.nonLife.find(i => i.id === currentInsurer);
      if (!ins || !ins.pdfFile) return;
      pdfDoc = await pdfjsLib.getDocument(encodeURI(`./forms/${ins.pdfFile}`)).promise;
      pageNum = 1;
      await renderPage();
    }

    async function changePage(delta) {
      if (!pdfDoc) return;
      const next = pageNum + delta;
      if (next < 1 || next > pdfDoc.numPages) return;
      pageNum = next;
      await renderPage();
    }

    async function renderPage() {
      const page = await pdfDoc.getPage(pageNum);
      pageWidthPt = page.view[2];
      pageHeightPt = page.view[3];

      const viewport = page.getViewport({ scale });
      const canvas = document.getElementById('pdf-canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      document.getElementById('page-info').textContent = `${pageNum} / ${pdfDoc.numPages} P`;

      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      renderPins();

      canvas.onclick = (e) => {
        if (justDragged) return;
        const rect = canvas.getBoundingClientRect();
        const pdfX = Math.round(((e.clientX - rect.left) / canvas.width) * pageWidthPt);
        const pdfY = Math.round(((canvas.height - (e.clientY - rect.top)) / canvas.height) * pageHeightPt);

        if (!PDF_COORD_MAP[currentInsurer]) {
          PDF_COORD_MAP[currentInsurer] = { fields: [], checks: [], signatures: [] };
        }
        const cfg = PDF_COORD_MAP[currentInsurer];
        const pIdx = pageNum - 1;

        if (selectedItem.type === 'field') {
          cfg.fields.push({ page: pIdx, key: selectedItem.key, x: pdfX, y: pdfY, size: 10 });
        } else if (selectedItem.type === 'check') {
          const condFn = new Function('return ' + selectedItem.condStr)();
          cfg.checks.push({ page: pIdx, cond: condFn, label: selectedItem.label.replace('✔ ', ''), x: pdfX, y: pdfY });
        } else if (selectedItem.type === 'sig') {
          cfg.signatures.push({ page: pIdx, role: selectedItem.role, x: pdfX, y: pdfY, w: 50, h: 20 });
        }
        renderPins();
      };
    }

    let justDragged = false;

    function attachPinDrag(pin, itemObj, labelPrefix) {
      pin.onmousedown = (e) => {
        if (e.button !== 0) return; // 좌클릭만 드래그 허용 (우클릭 삭제 유지)
        e.stopPropagation();
        e.preventDefault();

        const canvas = document.getElementById('pdf-canvas');
        const startMouseX = e.clientX;
        const startMouseY = e.clientY;
        const origLeft = parseFloat(pin.style.left);
        const origTop = parseFloat(pin.style.top);
        let moved = false;

        pin.classList.add('dragging');

        const onMouseMove = (moveEvent) => {
          const dx = moveEvent.clientX - startMouseX;
          const dy = moveEvent.clientY - startMouseY;
          if (Math.abs(dx) > 1 || Math.abs(dy) > 1) moved = true;

          const newLeft = Math.max(0, Math.min(canvas.width, origLeft + dx));
          const newTop = Math.max(0, Math.min(canvas.height, origTop + dy));

          pin.style.left = `${newLeft}px`;
          pin.style.top = `${newTop}px`;

          // 화면 픽셀 좌표를 PDF 포인트(pt) 좌표로 실시간 역산 (소수점 0.5 단위 정밀도 지원)
          const newPdfX = Math.round(((newLeft / canvas.width) * pageWidthPt) * 2) / 2;
          const newPdfY = Math.round((((canvas.height - newTop) / canvas.height) * pageHeightPt) * 2) / 2;

          itemObj.x = newPdfX;
          itemObj.y = newPdfY;
          pin.textContent = `${labelPrefix} (${itemObj.x},${itemObj.y})`;
        };

        const onMouseUp = () => {
          pin.classList.remove('dragging');
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          if (moved) {
            justDragged = true;
            setTimeout(() => { justDragged = false; }, 80);
          }
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      };
    }

    function renderPins() {
      const layer = document.getElementById('pins-layer');
      const canvas = document.getElementById('pdf-canvas');
      layer.innerHTML = '';
      const cfg = PDF_COORD_MAP[currentInsurer];
      if (!cfg) return;
      const pIdx = pageNum - 1;

      const toScreen = (x, y) => ({
        left: (x / pageWidthPt) * canvas.width,
        top: ((pageHeightPt - y) / pageHeightPt) * canvas.height
      });

      cfg.fields.forEach((f, idx) => {
        if (f.page !== pIdx) return;
        const pos = toScreen(f.x, f.y);
        const pin = document.createElement('div');
        pin.className = 'marker-pin';
        pin.style.left = `${pos.left}px`;
        pin.style.top = `${pos.top}px`;
        const condTag = f.cond ? (f.cond.toString().includes('!d.isUnder') ? '(성인)' : '(미성년/타인)') : '';
        const prefix = `${f.key}${condTag}${f.spacing ? `[칸:${f.spacing}]` : ''}`;
        pin.textContent = `${prefix} (${f.x},${f.y})`;
        pin.title = '드래그하여 위치 이동 / 우클릭 시 삭제';
        attachPinDrag(pin, f, prefix);
        pin.oncontextmenu = (e) => { e.preventDefault(); cfg.fields.splice(idx, 1); renderPins(); };
        layer.appendChild(pin);
      });

      // 조건식을 사람이 읽기 쉬운 라벨로 변환
     const getCheckTag = (c) => {
        if (c.label) return `✔${c.label}`;
        const src = c.cond ? c.cond.toString() : '';
        if (src.includes('accidentType')) return `✔사고:${src.split("'")[1] || ''}`;
        if (src.includes('claimCategory')) return `✔구분:${src.split("'")[1] || ''}`;
        if (src.includes('coverages')) return `✔담보:${src.split("'")[1] || ''}`;
        if (src.includes('useAutoTransfer')) return '✔자동이체';
        if (src.includes('isBenHolder') && src.includes('!d.isBenHolder')) return '✔안내:기타';
        if (src.includes('isBenHolder')) return '✔안내:계약자';
        if (src.includes('isSameInsBen')) return '✔안내:피보험자(상동)';
        if (src.includes('isUnder')) return '✔미성년동의';
        return '✔상시체크';
      };

      const ROLE_KR = { insured: '피보험자', beneficiary: '수익자', holder: '계약자', guardian: '법정대리인' };

      cfg.checks.forEach((c, idx) => {
        if (c.page !== pIdx) return;
        const pos = toScreen(c.x, c.y);
        const pin = document.createElement('div');
        pin.className = 'marker-pin';
        const tag = getCheckTag(c);
        pin.style.background = tag === '✔상시체크' ? '#059669' : '#d97706'; // 조건부 체크는 주황색 구분
        pin.style.left = `${pos.left}px`;
        pin.style.top = `${pos.top}px`;
        pin.textContent = `${tag} (${c.x},${c.y})`;
        pin.title = '드래그하여 위치 이동 / 우클릭 시 삭제';
        attachPinDrag(pin, c, tag);
        pin.oncontextmenu = (e) => { e.preventDefault(); cfg.checks.splice(idx, 1); renderPins(); };
        layer.appendChild(pin);
      });

      cfg.signatures.forEach((s, idx) => {
        if (s.page !== pIdx) return;
        const pos = toScreen(s.x, s.y);
        const pin = document.createElement('div');
        pin.className = 'marker-pin';
        pin.style.background = '#e11d48';
        pin.style.left = `${pos.left}px`;
        pin.style.top = `${pos.top}px`;
        const roleTag = `✍️서명:${ROLE_KR[s.role] || '공통'}`;
        pin.textContent = `${roleTag} (${s.x},${s.y})`;
        pin.title = '드래그하여 위치 이동 / 우클릭 시 삭제';
        attachPinDrag(pin, s, roleTag);
        pin.oncontextmenu = (e) => { e.preventDefault(); cfg.signatures.splice(idx, 1); renderPins(); };
        layer.appendChild(pin);
      });
    }

    // claim_coords.js 원본 구조(cond, role, bold, spacing 등)와 100% 동일한 포맷으로 코드 추출
    function exportCoords() {
      const cfg = PDF_COORD_MAP[currentInsurer];
      if (!cfg) return;

      const fieldsStr = cfg.fields.map(f => {
        const condPart = f.cond ? `, cond: ${f.cond.toString()}` : '';
        const boldPart = f.bold ? `, bold: true` : '';
        const spacingPart = f.spacing ? `, spacing: ${f.spacing}` : '';
        return `      { page: ${f.page}, key: '${f.key}'${condPart}, x: ${f.x}, y: ${f.y}, size: ${f.size || 10}${boldPart}${spacingPart} }`;
      }).join(',\n');

      const checksStr = cfg.checks.map(c => {
        const condSrc = c.cond ? c.cond.toString() : '() => true';
        const sizePart = c.size ? `, size: ${c.size}` : '';
        return `      { page: ${c.page}, cond: ${condSrc}, x: ${c.x}, y: ${c.y}${sizePart} }`;
      }).join(',\n');

      const sigsStr = cfg.signatures.map(s => {
        const rolePart = s.role ? `, role: '${s.role}'` : '';
        const condPart = s.cond ? `, cond: ${s.cond.toString()}` : '';
        return `      { page: ${s.page}${rolePart}${condPart}, x: ${s.x}, y: ${s.y}, w: ${s.w || 48}, h: ${s.h || 20} }`;
      }).join(',\n');

      const out = `  ${currentInsurer}: {\n    fields: [\n${fieldsStr}\n    ],\n    checks: [\n${checksStr}\n    ],\n    signatures: [\n${sigsStr}\n    ]\n  },`;
      navigator.clipboard.writeText(out).then(() => {
        alert(`✅ [${currentInsurer}] 좌표 코드가 원본과 동일한 형식으로 복사되었습니다!\nclaim_coords.js 파일에서 ${currentInsurer}: { ... }, 구간에 그대로 덮어씌워 주세요.`);
      });
    }

    initMapper();
  </script>
</body>
</html>
