<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>잇츠리온 - 보험금 청구 자동작성 엔진</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #2563eb;
      --card-bg: #f5f6f8;
      --text-dark: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f8fafc;
      color: var(--text-dark);
      min-height: 100vh;
      padding-bottom: 110px;
    }

    /* 전체 컨테이너: 모바일은 540px, PC에서는 1140px 와이드 화면 */
    .app-container {
      max-width: 540px;
      margin: 0 auto;
      background-color: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 25px rgba(0,0,0,0.04);
    }

    @media (min-width: 900px) {
      .app-container {
        max-width: 1140px;
      }
    }

    /* 상단 네비게이션 헤더 */
    .app-header {
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-dark);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .header-btn:hover {
      background-color: #f1f5f9;
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-dark);
    }

    /* 상단 프로그레스 바 */
    .progress-bar-wrap {
      width: 100%;
      height: 3px;
      background-color: var(--border-color);
      position: sticky;
      top: 64px;
      z-index: 99;
    }

    .progress-bar-fill {
      width: 50%;
      height: 100%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    /* 상단 안내 배너 */
    .guide-banner {
      padding: 24px 20px 12px;
    }

    .guide-banner h1 {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .guide-banner p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ★ 핵심: 모바일은 상하 배치, PC(900px 이상)는 좌(생명보험)/우(손해보험) 5:5 분할 */
    .split-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 12px 20px 24px;
    }

    @media (min-width: 900px) {
      .split-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 36px;
        padding: 20px 32px 40px;
        align-items: start;
      }

      .category-panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      }
    }

    .category-title {
      font-size: 16px;
      font-weight: 800;
      color: #4b5563;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      background-color: #f1f5f9;
      color: #475569;
    }

    /* 3열 그리드 레이아웃 (모바일 & PC 각 패널 내부 공통 3열 유지) */
    .insurer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
    }

    /* 스캔 이미지와 동일한 둥근 사각 카드 디자인 */
    .insurer-card {
      background-color: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 16px 6px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.16s ease;
      position: relative;
      min-height: 102px;
      user-select: none;
    }

    .insurer-card:hover {
      background-color: #eef1f6;
      transform: translateY(-1px);
    }

    .insurer-card.selected {
      background-color: var(--primary-light);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.14);
    }

    .check-badge {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .insurer-card.selected .check-badge {
      display: flex;
    }

    /* 각 보험사 심볼 로고 영역 */
    .logo-box {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .insurer-name {
      font-size: 13px;
      font-weight: 700;
      color: #1f2937;
      text-align: center;
      line-height: 1.25;
      word-break: keep-all;
      letter-spacing: -0.3px;
    }

    .insurer-sub {
      font-size: 10px;
      color: #6b7280;
      margin-top: 2px;
      font-weight: 600;
    }

    /* 하단 고정 실행 바 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 20px 20px;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
      z-index: 100;
    }

    @media (min-width: 900px) {
      .bottom-bar {
        max-width: 1140px;
        padding: 14px 32px 20px;
      }
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    .submit-btn:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    /* Step 2 화면 영역 */
    #step2-view {
      display: none;
      padding: 24px 20px;
      max-width: 720px;
      margin: 0 auto;
    }

    .selected-summary-box {
      background: var(--primary-light);
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .selected-summary-box h3 {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .fax-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      border: 1px solid #dbeafe;
    }

    .badge-virtual {
      background: #fef3c7;
      color: #b45309;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <button class="header-btn" onclick="handleBack()" title="이전">&#10094;</button>
      <div class="header-title" id="header-title">청구할 보험사 선택</div>
      <button class="header-btn" onclick="window.close()" title="닫기">&#10005;</button>
    </header>

    <!-- 상단 진행바 -->
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <!-- ================= [STEP 1: 보험사 선택 화면] ================= -->
    <main id="step1-view">
      <div class="guide-banner">
        <h1>청구할 보험사를 선택해주세요</h1>
        <p>여러 보험사를 동시에 선택하시면 한 번의 정보 입력으로 각각의 청구서가 자동 생성됩니다.</p>
      </div>

      <!-- PC: 좌측 생명보험사 / 우측 손해보험사 분할 | 모바일: 상하 3열 그리드 -->
      <div class="split-layout">
        
        <!-- [좌측 패널] 생명보험사 -->
        <section class="category-panel">
          <h2 class="category-title">
            <span>생명보험사</span>
            <span class="category-badge">23개사</span>
          </h2>
          <div class="insurer-grid" id="life-grid"></div>
        </section>

        <!-- [우측 패널] 손해보험사 -->
        <section class="category-panel">
          <h2 class="category-title">
            <span>손해보험사</span>
            <span class="category-badge">16개사</span>
          </h2>
          <div class="insurer-grid" id="non-life-grid"></div>
        </section>

      </div>
    </main>

    <!-- ================= [STEP 2: 정보 입력 및 서명 화면] ================= -->
    <main id="step2-view">
      <div class="selected-summary-box">
        <h3>선택한 보험사 및 청구 팩스번호 안내</h3>
        <div id="selected-fax-list"></div>
      </div>
      <div id="step2-form-Placeholder" style="text-align:center; padding: 40px 10px; color:#4b5563; font-size:14px;">
        1단계 화면 구성이 완료되었습니다.<br>이어서 <b>[2단계: 공통 정보 입력 폼 + 전자서명 패드]</b>가 이 자리에 연결됩니다.
      </div>
    </main>

    <!-- 하단 고정 버튼 -->
    <div class="bottom-bar">
      <button class="submit-btn" id="next-btn" disabled onclick="goToStep2()">
        보험사를 선택해주세요
      </button>
    </div>
  </div>

  <script>

     */

      ]
    };

    const selectedInsurerIds = new Set();
    let currentStep = 1;

    function renderInsurerGrid() {
      document.getElementById('life-grid').innerHTML = INSURER_DB.life.map(createCardHTML).join('');
      document.getElementById('non-life-grid').innerHTML = INSURER_DB.nonLife.map(createCardHTML).join('');
    }

    function createCardHTML(item) {
      const isSelected = selectedInsurerIds.has(item.id) ? 'selected' : '';
      return `
        <div class="insurer-card ${isSelected}" id="card-${item.id}" onclick="toggleInsurer('${item.id}')">
          <div class="check-badge">&#10003;</div>
          <div class="logo-box">${item.logo}</div>
          <div class="insurer-name">${item.name}</div>
          ${item.subName ? `<div class="insurer-sub">${item.subName}</div>` : ''}
        </div>
      `;
    }

    function toggleInsurer(id) {
      const cardEl = document.getElementById(`card-${id}`);
      if (selectedInsurerIds.has(id)) {
        selectedInsurerIds.delete(id);
        cardEl.classList.remove('selected');
      } else {
        selectedInsurerIds.add(id);
        cardEl.classList.add('selected');
      }
      updateBottomButton();
    }

    function updateBottomButton() {
      const btn = document.getElementById('next-btn');
      const count = selectedInsurerIds.size;
      if (count === 0) {
        btn.disabled = true;
        btn.textContent = '보험사를 선택해주세요';
      } else {
        btn.disabled = false;
        btn.textContent = `${count}개 보험사 청구서 작성하기`;
      }
    }

    function goToStep2() {
      if (selectedInsurerIds.size === 0) return;
      currentStep = 2;

      document.getElementById('step1-view').style.display = 'none';
      document.getElementById('step2-view').style.display = 'block';
      document.getElementById('header-title').textContent = '청구 정보 및 전자서명 입력';
      document.getElementById('progress-bar').style.width = '100%';

      const allInsurers = [...INSURER_DB.life, ...INSURER_DB.nonLife];
      const selectedObjects = allInsurers.filter(ins => selectedInsurerIds.has(ins.id));

      document.getElementById('selected-fax-list').innerHTML = selectedObjects.map(ins => `
        <div class="fax-item">
          <div>
            <strong>${ins.name}</strong>
            <div style="font-size:11px; color:#6b7280; margin-top:2px;">콜센터: ${ins.call}</div>
          </div>
          <div style="text-align:right;">
            ${ins.faxType === 'virtual'
              ? `<span class="badge-virtual">콜센터 가상팩스 발급필요</span>`
              : `<strong style="color:#1e3a8a;">FAX: ${ins.fax}</strong>`
            }
          </div>
        </div>
      `).join('');

      document.getElementById('next-btn').textContent = '청구서 PDF 생성 및 다운로드';
      window.scrollTo(0, 0);
    }

    function handleBack() {
      if (currentStep === 2) {
        currentStep = 1;
        document.getElementById('step2-view').style.display = 'none';
        document.getElementById('step1-view').style.display = 'block';
        document.getElementById('header-title').textContent = '청구할 보험사 선택';
        document.getElementById('progress-bar').style.width = '50%';
        updateBottomButton();
      } else {
        window.close();
      }
    }

    renderInsurerGrid();
  </script>
</body>
</html>
