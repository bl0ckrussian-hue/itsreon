<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>잇츠리온 - 청구할 보험사 선택 (1단계)</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- 분리된 보험사 마스터 DB 및 좌표 파일 로드 -->
  <script src="./claim_coords.js"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #2563eb;
      --card-bg: #f5f6f8;
      --text-dark: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .app-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
    }

    .close-btn {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .close-btn:hover {
      background-color: #e2e8f0;
    }

    .guide-banner {
      padding: 12px 24px 4px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .guide-banner h1 {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
    }

    .guide-banner p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .split-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 12px 20px 20px;
      width: 100%;
    }

    @media (min-width: 900px) {
      body { padding-bottom: 76px; }
      .guide-banner { padding: 12px 32px 4px; }
      .app-header { padding: 10px 32px; }
      .split-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 8px 32px 16px;
        align-items: start;
      }
      .category-panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 20px;
      }
    }

    .category-title {
      font-size: 16px;
      font-weight: 800;
      color: #374151;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      background-color: #f1f5f9;
      color: #475569;
    }

    .insurer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    @media (min-width: 900px) {
      .insurer-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
    }

    .insurer-card {
      background-color: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.16s ease;
      position: relative;
      min-height: 78px;
      user-select: none;
    }

    .insurer-card:hover {
      background-color: #eef1f6;
      transform: translateY(-1px);
    }

    .insurer-card.selected {
      background-color: var(--primary-light);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.14);
    }

    .check-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .insurer-card.selected .check-badge { display: flex; }

    .logo-box {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .insurer-name {
      font-size: 14px;
      font-weight: 800;
      color: #1f2937;
      text-align: center;
      line-height: 1.2;
      word-break: keep-all;
      letter-spacing: -0.3px;
    }

    .insurer-sub {
      font-size: 10.5px;
      color: #6b7280;
      margin-top: 2px;
      font-weight: 600;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 20px 20px;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      z-index: 100;
    }

    @media (min-width: 900px) {
      .bottom-bar { padding: 14px 40px 20px; }
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-title">청구할 보험사 선택</div>
    <div style="display:flex; gap:8px;">
      <a href="./claim_mapper.html" target="_blank" class="close-btn" style="background:#eff6ff; color:#1e3a8a; border-color:#bfdbfe;">🎯 양식 위치 마우스 배치기</a>
      <button class="close-btn" onclick="closeWindow()">창닫기</button>
    </div>
  </header>

  <main>
    <div class="guide-banner">
      <h1>청구할 보험사를 선택해주세요</h1>
      <p>여러 보험사를 동시에 선택하시면 한 번의 정보 입력으로 각각의 청구서가 자동 생성됩니다.</p>
    </div>

    <div class="split-layout">
      <section class="category-panel">
        <h2 class="category-title"><span>생명보험사</span><span class="category-badge">23개사</span></h2>
        <div class="insurer-grid" id="life-grid"></div>
      </section>
      <section class="category-panel">
        <h2 class="category-title"><span>손해보험사</span><span class="category-badge">16개사</span></h2>
        <div class="insurer-grid" id="non-life-grid"></div>
      </section>
    </div>
  </main>

  <div class="bottom-bar">
    <button class="submit-btn" id="next-btn" disabled onclick="goToFormPage()">보험사를 선택해주세요</button>
  </div>

  <script>
    // 이전에 선택했던 보험사가 있으면 복원
    const savedIds = JSON.parse(sessionStorage.getItem('rion_selected_insurers') || '[]');
    const selectedInsurerIds = new Set(savedIds);

    function renderInsurerGrid() {
      document.getElementById('life-grid').innerHTML = INSURER_DB.life.map(createCardHTML).join('');
      document.getElementById('non-life-grid').innerHTML = INSURER_DB.nonLife.map(createCardHTML).join('');
      updateBottomButton();
    }

    function createCardHTML(item) {
      const isSelected = selectedInsurerIds.has(item.id) ? 'selected' : '';
      return `
        <div class="insurer-card ${isSelected}" id="card-${item.id}" onclick="toggleInsurer('${item.id}')">
          <div class="check-badge">&#10003;</div>
          <div class="logo-box">${item.logo}</div>
          <div class="insurer-name">${item.name}</div>
          ${item.subName ? `<div class="insurer-sub">${item.subName}</div>` : ''}
        </div>
      `;
    }

    function toggleInsurer(id) {
      const cardEl = document.getElementById(`card-${id}`);
      if (selectedInsurerIds.has(id)) {
        selectedInsurerIds.delete(id);
        cardEl.classList.remove('selected');
      } else {
        selectedInsurerIds.add(id);
        cardEl.classList.add('selected');
      }
      updateBottomButton();
    }

    function updateBottomButton() {
      const btn = document.getElementById('next-btn');
      const count = selectedInsurerIds.size;
      if (count === 0) {
        btn.disabled = true;
        btn.textContent = '보험사를 선택해주세요';
      } else {
        btn.disabled = false;
        btn.textContent = `${count}개 보험사 청구서 작성하기 →`;
      }
    }

    // 선택한 보험사 ID 배열을 세션에 전달하고 2단계(claim_form.html)로 이동
    function goToFormPage() {
      if (selectedInsurerIds.size === 0) return;
      sessionStorage.setItem('rion_selected_insurers', JSON.stringify(Array.from(selectedInsurerIds)));
      window.location.href = './claim_form.html';
    }

    function closeWindow() {
      window.close();
      setTimeout(() => { window.location.href = './index.html'; }, 150);
    }

    renderInsurerGrid();
  </script>
</body>
</html>
