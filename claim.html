<!DOCTYPE html>
<html lang="ko">
<head>
  <head>
  <script>
    (function checkRionAuth() {
      const user = localStorage.getItem('rion_logged_user');
      const session = localStorage.getItem('rion_session_id');
      if (!user || !session) {
        alert('보안 접근입니다. 메인 홈페이지에서 로그인 후 이용해 주세요.');
        window.close();
        location.replace('./index.html');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>잇츠리온 - 청구할 보험사 선택 (1단계)</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="./claim_coords.js"></script>
  <script src="./claim_coords2.js"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --accent: #2563eb;
      --card-bg: #f5f6f8;
      --text-dark: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .app-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
    }

    .close-btn {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .close-btn:hover {
      background-color: #e2e8f0;
    }

    .guide-banner {
      padding: 12px 24px 4px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .guide-banner h1 {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
    }

    .guide-banner p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .split-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 12px 20px 20px;
      width: 100%;
    }

    @media (min-width: 900px) {
      body { padding-bottom: 76px; }
      .guide-banner { padding: 12px 32px 4px; }
      .app-header { padding: 10px 32px; }
      .split-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 8px 32px 16px;
        align-items: start;
      }
      .category-panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 20px;
      }
    }

    .category-title {
      font-size: 16px;
      font-weight: 800;
      color: #374151;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .category-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
      background-color: #f1f5f9;
      color: #475569;
    }

    .insurer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    @media (min-width: 900px) {
      .insurer-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
    }

    .insurer-card {
      background-color: var(--card-bg);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.16s ease;
      position: relative;
      min-height: 78px;
      user-select: none;
    }

    .insurer-card:hover {
      background-color: #eef1f6;
      transform: translateY(-1px);
    }

    .insurer-card.selected {
      background-color: var(--primary-light);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.14);
    }

    .check-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .insurer-card.selected .check-badge { display: flex; }

    .logo-box {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .insurer-name {
      font-size: 14px;
      font-weight: 800;
      color: #1f2937;
      text-align: center;
      line-height: 1.2;
      word-break: keep-all;
      letter-spacing: -0.3px;
    }

    .insurer-sub {
      font-size: 10.5px;
      color: #6b7280;
      margin-top: 2px;
      font-weight: 600;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 20px 20px;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      z-index: 100;
    }

    @media (min-width: 900px) {
      .bottom-bar { padding: 14px 40px 20px; }
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }
    /* 미반영 보험사 카드 비활성화 및 정중앙 '미반영' 배지 스타일 */
    .insurer-card.unapplied {
      opacity: 0.55;
      cursor: not-allowed;
      background-color: #f1f5f9;
    }

    .insurer-card.unapplied:hover {
      background-color: #f1f5f9;
      transform: none;
    }

    .unapplied-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(241, 245, 249, 0.52);
      border-radius: 12px;
      z-index: 5;
      pointer-events: none;
    }

    .unapplied-tag {
      background: rgba(15, 23, 42, 0.78);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 11px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-title">청구할 보험사 선택</div>
    <div style="display:flex; gap:8px;">
      <button class="close-btn" onclick="closeWindow()">창닫기</button>
    </div>
  </header>

  <main>
    <div class="guide-banner">
      <h1>청구할 보험사를 선택해주세요</h1>
      <p>여러 보험사를 동시에 선택하시면 한 번의 정보 입력으로 각각의 청구서가 자동 생성됩니다.</p>
    </div>

    <div class="split-layout">
      <section class="category-panel">
        <h2 class="category-title"><span>생명보험사</span><span class="category-badge">23개사</span></h2>
        <div class="insurer-grid" id="life-grid"></div>
      </section>
      <section class="category-panel">
        <h2 class="category-title"><span>손해보험사</span><span class="category-badge">16개사</span></h2>
        <div class="insurer-grid" id="non-life-grid"></div>
      </section>
    </div>
  </main>

  <div class="bottom-bar">
    <button class="submit-btn" id="next-btn" disabled onclick="goToFormPage()">보험사를 선택해주세요</button>
  </div>

  <script>
    sessionStorage.removeItem('rion_selected_insurers');
    const selectedInsurerIds = new Set();

    const UNAPPLIED_IDS = new Set([
      'post_ins',     // 우체국보험
      'ktcu_life',    // 교직원공제회보험
      'kyobo_planet', // 교보라이프플래닛생명
      'axa',          // AXA손해보험
      'shinhan_ez',   // 신한EZ손해보험
      'carrot'        // 캐롯손해보험
    ]);

    function sortUnappliedLast(list) {
      const active = list.filter(item => !UNAPPLIED_IDS.has(item.id));
      const unapplied = list.filter(item => UNAPPLIED_IDS.has(item.id));
      return [...active, ...unapplied];
    }

    function renderInsurerGrid() {
      INSURER_DB.life = sortUnappliedLast(INSURER_DB.life);
      INSURER_DB.nonLife = sortUnappliedLast(INSURER_DB.nonLife);

      document.getElementById('life-grid').innerHTML = INSURER_DB.life.map(createCardHTML).join('');
      document.getElementById('non-life-grid').innerHTML = INSURER_DB.nonLife.map(createCardHTML).join('');
      updateBottomButton();
    }
    function createCardHTML(item) {
      const isUnapplied = UNAPPLIED_IDS.has(item.id);
      const isSelected = (!isUnapplied && selectedInsurerIds.has(item.id)) ? 'selected' : '';
      const unappliedClass = isUnapplied ? 'unapplied' : '';

      return `
        <div class="insurer-card ${isSelected} ${unappliedClass}" id="card-${item.id}" onclick="toggleInsurer('${item.id}')">
          <div class="check-badge">&#10003;</div>
          ${isUnapplied ? `<div class="unapplied-overlay"><span class="unapplied-tag">미반영</span></div>` : ''}
          <div class="logo-box">${item.logo}</div>
          <div class="insurer-name">${item.name}</div>
          ${item.subName ? `<div class="insurer-sub">${item.subName}</div>` : ''}
        </div>
      `;
    }

    function toggleInsurer(id) {
      if (UNAPPLIED_IDS.has(id)) return; // 미반영 보험사 클릭 방지
      const cardEl = document.getElementById(`card-${id}`);
      if (selectedInsurerIds.has(id)) {
        selectedInsurerIds.delete(id);
        cardEl.classList.remove('selected');
      } else {
        selectedInsurerIds.add(id);
        cardEl.classList.add('selected');
      }
      updateBottomButton();
    }

    function updateBottomButton() {
      const btn = document.getElementById('next-btn');
      const count = selectedInsurerIds.size;
      if (count === 0) {
        btn.disabled = true;
        btn.textContent = '보험사를 선택해주세요';
      } else {
        btn.disabled = false;
        btn.textContent = `${count}개 보험사 청구서 작성하기 →`;
      }
    }

    function goToFormPage() {
      if (selectedInsurerIds.size === 0) return;
      sessionStorage.setItem('rion_selected_insurers', JSON.stringify(Array.from(selectedInsurerIds)));
      window.location.href = './claim_form.html';
    }

    function closeWindow() {
      window.close();
      setTimeout(() => { window.location.href = './index.html'; }, 150);
    }

    renderInsurerGrid();
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        sessionStorage.removeItem('rion_selected_insurers');
        selectedInsurerIds.clear();
        document.querySelectorAll('.insurer-card.selected').forEach(el => el.classList.remove('selected'));
        updateBottomButton();
      }
    });

    // ⭐️ 보험사 선택 중 메인 창 자동 로그아웃 방지
    (function keepRionSessionAlive() {
      const syncRionActivity = () => { if (localStorage.getItem('rion_logged_user')) localStorage.setItem('rion_last_activity', Date.now().toString()); };
      syncRionActivity();
      ['mousedown', 'keypress', 'scroll', 'touchstart'].forEach(evt => document.addEventListener(evt, syncRionActivity, { passive: true }));
    })();
  </script>
</body>
</html>
