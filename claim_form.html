  <title>잇츠리온 - 청구 정보 및 전자서명 입력 (2단계)</title>

      --primary-light: #eff6ff;

      --text-dark: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f8fafc;
      color: var(--text-dark);
      width: 100%;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .app-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-title { font-size: 17px; font-weight: 800; }

    .close-btn {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .form-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }

    .selected-summary-box {
      background: var(--primary-light);
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .selected-summary-box h3 {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .fax-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      border: 1px solid #dbeafe;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-virtual {
      background: #fef3c7;
      color: #b45309;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .copy-fax-btn {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 6px;
    }
