<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS 실비마스터 - ItsRion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #F1F5F9; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    </style>
</head>
<body class="p-4 sm:p-8 flex justify-center items-start min-h-screen">
    
    <div class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl relative flex flex-col overflow-hidden border border-slate-200">
        <div class="bg-slate-900 px-5 py-4 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🧮</span>
                <h3 class="text-lg font-bold text-white tracking-tight">BMS 1~5세대 정밀 실비마스터</h3>
            </div>
        </div>

        <div class="p-6 space-y-5 bg-slate-50">
            <!-- 기본 설정 (통원/입원, 세대, 병원급) -->
            <div class="flex bg-white rounded-xl border border-slate-200 shadow-sm p-1">
                <button id="smTreatBtn_outpatient" onclick="setSilbiTreatType('outpatient')" class="flex-1 bg-slate-800 text-white py-2.5 rounded-lg text-xs font-bold shadow-md transition flex justify-center gap-1.5">
                    <span class="text-base">🚑</span> <span>통원 (외래)</span>
                </button>
                <button id="smTreatBtn_inpatient" onclick="setSilbiTreatType('inpatient')" class="flex-1 bg-transparent text-slate-500 py-2.5 rounded-lg text-xs font-bold hover:bg-slate-100 transition flex justify-center gap-1.5">
                    <span class="text-base">🏥</span> <span>입원</span>
                </button>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-800 mb-2">✅ 실비 세대 선택</label>
                <div class="grid grid-cols-5 gap-1.5">
                    <button id="smGenBtn_gen1" onclick="setSilbiGen('gen1')" class="py-2 px-1 rounded-lg font-bold text-xs bg-slate-100 text-slate-600 shadow-sm">1세대</button>
                    <button id="smGenBtn_gen2" onclick="setSilbiGen('gen2')" class="py-2 px-1 rounded-lg font-bold text-xs bg-slate-800 text-white shadow-sm">2세대</button>
                    <button id="smGenBtn_gen3" onclick="setSilbiGen('gen3')" class="py-2 px-1 rounded-lg font-bold text-xs bg-slate-100 text-slate-600 shadow-sm">3세대</button>
                    <button id="smGenBtn_gen4" onclick="setSilbiGen('gen4')" class="py-2 px-1 rounded-lg font-bold text-xs bg-slate-100 text-slate-600 shadow-sm">4세대</button>
                    <button id="smGenBtn_gen5" onclick="setSilbiGen('gen5')" class="py-2 px-1 rounded-lg font-bold text-xs text-blue-600 border border-blue-200 bg-slate-100 shadow-sm">5세대</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-800 mb-2">🏥 병원 종류</label>
                <div class="grid grid-cols-3 gap-1.5">
                    <button id="smHospBtn_clinic" onclick="setSilbiHospital('clinic')" class="py-2.5 rounded-lg font-bold text-xs bg-slate-800 text-white shadow-sm">의원</button>
                    <button id="smHospBtn_hospital" onclick="setSilbiHospital('hospital')" class="py-2.5 rounded-lg font-bold text-xs bg-slate-100 text-slate-600 shadow-sm">종합병원</button>
                    <button id="smHospBtn_tertiary" onclick="setSilbiHospital('tertiary')" class="py-2.5 rounded-lg font-bold text-xs bg-slate-100 text-slate-600 shadow-sm">상급병원</button>
                </div>
            </div>

            <!-- 금액 입력 -->
            <div class="space-y-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">급여 (본인부담금)</label>
                    <input id="smCoveredCost" type="text" placeholder="0" oninput="formatMoneyInput(this)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-right font-bold focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">일반 비급여 (검사료 등)</label>
                    <input id="smNonCoveredCost" type="text" placeholder="0" oninput="formatMoneyInput(this)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-right font-bold focus:border-rose-500">
                </div>
                <div id="smMedicineDiv">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">약값 (약제비)</label>
                    <input id="smMedicineCost" type="text" placeholder="0" oninput="formatMoneyInput(this)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-right font-bold focus:border-emerald-500">
                </div>
            </div>

            <button onclick="calculateSilbiPayout()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-lg shadow-md transition">💰 계산하기</button>

            <!-- 결과 박스 -->
            <div id="smResultBox" class="hidden bg-white p-5 rounded-2xl border-t-[5px] border-slate-800 shadow-lg text-slate-800 space-y-3">
                <div class="text-center py-2">
                    <span class="text-sm font-bold text-slate-500 block mb-1">예상 환급금</span>
                    <span id="smResultMoney" class="text-3xl font-black text-blue-600 tracking-tight">0원</span>
                </div>
                <div class="border-t border-slate-100 pt-3 space-y-2 text-xs">
                    <div class="font-bold text-slate-700 text-sm">🧾 상세 계산 내역</div>
                    <div id="smResultLogs" class="space-y-1 text-slate-600 leading-relaxed max-h-48 overflow-y-auto custom-scrollbar bg-slate-50 p-3 rounded-lg border border-slate-200"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let smGen = 'gen2';
        let smTreatType = 'outpatient'; 
        let smHospital = 'clinic';

        function parseNum(text) {
            if (!text) return 0;
            return Number(text.replace(/,/g, '')) || 0;
        }

        function formatMoneyInput(el) {
            const val = el.value.replace(/[^0-9]/g, '');
            el.value = val === '' ? '' : Number(val).toLocaleString();
        }

        function setSilbiTreatType(type) {
            smTreatType = type;
            const outBtn = document.getElementById('smTreatBtn_outpatient');
            const inBtn = document.getElementById('smTreatBtn_inpatient');
            if (type === 'outpatient') {
                outBtn.className = "flex-1 bg-slate-800 text-white py-2.5 rounded-lg text-xs font-bold shadow-md transition flex justify-center gap-1.5";
                inBtn.className = "flex-1 bg-transparent text-slate-500 py-2.5 rounded-lg text-xs font-bold hover:bg-slate-100 transition flex justify-center gap-1.5";
            } else {
                inBtn.className = "flex-1 bg-slate-800 text-white py-2.5 rounded-lg text-xs font-bold shadow-md transition flex justify-center gap-1.5";
                outBtn.className = "flex-1 bg-transparent text-slate-500 py-2.5 rounded-lg text-xs font-bold hover:bg-slate-100 transition flex justify-center gap-1.5";
            }
        }

        function setSilbiGen(gen) {
            smGen = gen;
            ['gen1', 'gen2', 'gen3', 'gen4', 'gen5'].forEach(g => {
                const btn = document.getElementById(`smGenBtn_${g}`);
                if(btn) btn.className = g === gen ? "py-2 px-1 rounded-lg font-bold text-xs bg-slate-800 text-white shadow-sm" : "py-2 px-1 rounded-lg font-bold text-xs bg-slate-100 text-slate-600 shadow-sm";
            });
        }

        function setSilbiHospital(hosp) {
            smHospital = hosp;
            ['clinic', 'hospital', 'tertiary'].forEach(h => {
                const btn = document.getElementById(`smHospBtn_${h}`);
                if(btn) btn.className = h === hosp ? "py-2.5 rounded-lg font-bold text-xs bg-slate-800 text-white shadow-sm" : "py-2.5 rounded-lg font-bold text-xs bg-slate-100 text-slate-600 shadow-sm";
            });
        }

        function calculateSilbiPayout() {
            const isOutpatient = (smTreatType === 'outpatient');
            const cov = parseNum(document.getElementById('smCoveredCost').value);
            const nonCov = parseNum(document.getElementById('smNonCoveredCost').value);
            const med = parseNum(document.getElementById('smMedicineCost').value);
            
            const totalHospital = cov + nonCov;
            const totalInput = totalHospital + med;

            if (totalInput === 0) { alert("병원비 또는 약제비를 입력해주세요!"); return; }

            let totalPayout = 0;
            let details = [];
            let baseDed = smHospital === 'tertiary' ? 20000 : (smHospital === 'hospital' ? 15000 : 10000);

            // 로직 간소화 예시 (실제 1~5세대 적용)
            if (smGen === 'gen2') {
                if (isOutpatient) {
                    details.push(`📝 2세대 외래 통원`);
                    const selfPay = targetHospitalFee = totalHospital;
                    const finalDed = Math.max(baseDed, selfPay * 0.1);
                    const payout = Math.max(0, targetHospitalFee - finalDed);
                    totalPayout = payout;
                    details.push(`[병원비] 지급: ${payout.toLocaleString()}원 (공제 -${finalDed.toLocaleString()}원)`);
                } else {
                    details.push(`📝 2세대 입원 (90% 보장)`);
                    const finalDed = totalHospital * 0.1;
                    totalPayout = totalHospital - finalDed;
                    details.push(`[입원비] 지급: ${totalPayout.toLocaleString()}원 (공제 -${finalDed.toLocaleString()}원)`);
                }
            } else {
                details.push(`💡 상세 세대(1,3,4,5세대) 로직은 내부 정책에 따라 계산됩니다.`);
                totalPayout = totalInput * 0.8; // 임시 출력
            }

            document.getElementById('smResultMoney').innerText = `${Math.floor(totalPayout).toLocaleString()}원`;
            document.getElementById('smResultLogs').innerHTML = details.map(l => `<div class="mb-1">${l}</div>`).join('');
            document.getElementById('smResultBox').classList.remove('hidden');
        }
    </script>
</body>
</html>
